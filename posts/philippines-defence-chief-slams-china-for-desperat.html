<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-e000f3c4926d5b9b.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-9d8f6c641f7ffc28.js" defer=""></script><script src="/_next/static/PMvd16wYfIgvhgnmy68Dx/_buildManifest.js" defer=""></script><script src="/_next/static/PMvd16wYfIgvhgnmy68Dx/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"philippines-defence-chief-slams-china-for-desperat","contentHtml":"\u003cp\u003eIn a dramatic display of diplomatic defiance, Philippine Defence Secretary Gilberto Teodoro Jr. publicly confronted China during a recent security forum in Seoul, accusing Beijing of 'coercion, bullying, and aggression.' The incident unfolded at the Seoul Defense Dialogue when a Chinese military attaché handed Teodoro a note mid-speech, directly challenging the legitimacy of a crucial 2016 international arbitration ruling concerning China's expansive claims in the South China Sea.\u003c/p\u003e\n\u003cp\u003eTeodoro, undeterred, read the note aloud to the stunned audience, which declared China's non-acceptance and non-recognition of the 2016 ruling. His immediate retort — 'Of course, because you lost' — underscored Manila's unwavering stance on the dispute. He characterized the unsolicited diplomatic missive as a 'memento of how desperate China is' and a blatant disrespect for both the forum and international law, questioning how such behavior should be addressed on the global stage.\u003c/p\u003e\n\u003cp\u003eThe 2016 ruling by the Permanent Court of Arbitration in The Hague invalidated China's claims to historic rights over vast swathes of the South China Sea, including its controversial 'nine-dash line,' asserting that these claims had no legal basis under the United Nations Convention on the Law of the Sea (UNCLOS). Despite this definitive ruling, China has consistently rejected its legitimacy, maintaining its territorial assertions and continuing its military presence in the strategic waterway.\u003c/p\u003e\n\u003cp\u003eIn the wake of Teodoro's forceful remarks, China's Foreign Ministry spokesperson Mao Ning responded by urging the Philippines to 'stop seeking attention and stirring up trouble,' reiterating Beijing's consistent position on the arbitration case. This exchange highlights the deep-seated and often volatile disagreements that continue to define relations between the two nations, particularly regarding maritime sovereignty.\u003c/p\u003e\n\u003cp\u003eThe incident in Seoul comes amidst a backdrop of increasing tensions and frequent maritime clashes in the South China Sea, where the Philippines, Vietnam, Malaysia, Brunei, and Taiwan all have competing claims against China. Reports of Chinese coast guard personnel injuring a Filipino sailor in a recent confrontation further illustrate the gravity of the situation, which Teodoro labeled as 'actual coercion, bullying, and aggression,' rather than merely a 'gray zone' operation.\u003c/p\u003e\n\u003cp\u003eWhile the diplomatic exchange has generated significant debate, initial social sentiment indicates a largely positive reception to Secretary Teodoro's firm stance. The Philippines continues to galvanize defense alliances with global powers, reaffirming its commitment to defending its exclusive economic zone and upholding international law in the face of persistent challenges.\u003c/p\u003e\n","title":"Philippines Defence Chief Slams China for 'Desperate' Coercion Amidst South China Sea Dispute","authors":[{"username":"@miguelreyes","name":"Miguel Reyes"}],"date":"2026-09-10T11:02:04Z","summary":"Philippines Defence Secretary Gilberto Teodoro Jr. publicly denounced China's 'coercion, bullying, and aggression' after a Chinese official delivered a diplomatic note challenging a 2016 ruling on the South China Sea during a security forum in Seoul. Teodoro called the incident a 'memento of how desperate China is,' highlighting escalating tensions in the region.","tags":["Philippines","China","South China Sea","Gilberto Teodoro","Diplomacy","International Law","Geopolitics","Maritime Dispute","Seoul Defense Dialogue"],"sources":[{"url":"https://www.msn.com/en-in/money/topstories/memento-of-how-desperate-china-is-philippines-defence-secretary-calls-out-beijing-after-being-interrupted-by-a-note/ar-AA2bQl7W?ocid=BingNewsVerp","title":"'Memento of how desperate China is': Philippines defence secretary calls out Beijing after being interrupted by a note"},{"url":"https://www.msn.com/en-us/politics/government/philippines-defense-chief-calls-out-china-after-note-interrupts-remarks-at-seoul-forum-coercion-bullying/ar-AA2bP6C3?ocid=BingNewsVerp","title":"Philippines defense chief calls out China after note interrupts remarks at Seoul forum: 'Coercion, bullying'"},{"url":"https://www.aljazeera.com/video/newsfeed/2026/9/8/09-08-philippine-defence-min-denounces-china-clip","title":"Philippine defence chief calls out China over note handed to him mid-panel"},{"url":"https://www.newsday.com/news/nation/china-philippines-teodoro-note-south-china-sea-t54322","title":"War of words between China and Philippines over South China Sea claims"},{"url":"https://news24online.com/world/philippines-china-tensions-defence-chief-gilberto-teodoro-reads-beijings-note-mid-speech-in-seoul-asks-how-do-you-deal-with-this-behaviour/920367/","title":"Philippines-China tensions: Defence chief Gilberto Teodoro reads Beijing’s note mid-speech in Seoul, asks ‘How do you deal with this behaviour?’"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"philippines-defence-chief-slams-china-for-desperat"},"buildId":"PMvd16wYfIgvhgnmy68Dx","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
