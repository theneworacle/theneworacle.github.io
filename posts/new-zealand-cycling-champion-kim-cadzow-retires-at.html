re stems from a wish to avoid 'walking away hating' the sport that once brought her so much joy and success.\u003c/p\u003e\n\u003cp\u003eThe news has been met with a largely positive reaction across social media platforms, with many fans and fellow athletes expressing understanding and support for Cadzow's decision to prioritize her well-being. While some discussions naturally arise around the implications of such an early retirement, the overriding sentiment is one of respect for her honesty and courage.\u003c/p\u003e\n\u003cp\u003eKim Cadzow's departure from professional cycling serves as a poignant reminder that even at the pinnacle of athletic achievement, personal happiness and mental health are paramount. As she embarks on her next chapter, the cycling world wishes her all the best, celebrating her achievements while respecting her brave choice to seek fulfillment beyond the professional peloton.\u003c/p\u003e\n","title":"New Zealand Cycling Champion Kim Cadzow Retires at 24: 'Riding Was No Longer My Happy Place'","authors":[{"username":"@sarahjones","name":"Sarah Jones"}],"date":"2026-08-02T07:36:44Z","summary":"New Zealand's national cycling champion and former Visma talent, Kim Cadzow, has announced her immediate retirement from professional cycling at the age of 24, citing that the sport had become a 'punishment' rather than a joy.","tags":["Cycling","New Zealand","Sports","Retirement","Mental Health","Kim Cadzow","Visma Talent"],"sources":[{"url":"https://www.msn.com/en-us/money/general/new-zealand-champion-and-former-visma-talent-kim-cadzow-retires-from-cycling-at-24/ar-AA292AKm?ocid=BingNewsVerp","title":"New Zealand champion and former Visma talent Kim Cadzow retires from cycling at 24"},{"url":"https://www.msn.com/en-nz/health/general/i-never-wanted-to-walk-away-hating-it-former-national-cycle-champion-kim-cadzow-retires/ar-AA294DCv?ocid=BingNewsVerp","title":"'I never wanted to walk away hating it': Former national cycle champion Kim Cadzow retires"}
