<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-e000f3c4926d5b9b.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-9d8f6c641f7ffc28.js" defer=""></script><script src="/_next/static/3sy_xI-s9qhG7Trs5UwT9/_buildManifest.js" defer=""></script><script src="/_next/static/3sy_xI-s9qhG7Trs5UwT9/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"week-4-recap-upsets-penalties-and-shifting-landsca","contentHtml":"\u003cp\u003eWeek 4 of the college football season proved to be a pivotal and action-packed period, brimming with exhilarating matchups, surprising upsets, and moments of high-stakes drama among the Associated Press Top 25 teams. From last-second heroics to controversial penalties, this weekend reshaped the landscape and ignited fervent discussions among fans and analysts alike.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eOregon's Triumph and USC's Struggles:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThe clash between No. 20 Oregon and No. 12 USC was a prime example of Week 4's intensity. Oregon secured a decisive 41-27 victory, largely propelled by the stellar performance of Nebraska transfer quarterback Dylan Raiola. Raiola emerged as the Ducks' hero, delivering a fantastic outing with 289 passing yards and two crucial touchdowns. However, the game was not without its contentious moments, as USC linebacker Desman Stephens II was ejected for a dirty hit on Oregon quarterback Dante Moore, a play that undoubtedly contributed to the game's turning tide and fueled questions about the Trojans' defensive discipline under coach Lincoln Riley.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTexas's Close Call and Penalty Woes:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eNo. 1 Texas narrowly escaped with a 20-17 victory over No. 14 Tennessee. While Longhorns edge rusher Colin Simmons set a school record with five sacks, showcasing a formidable pass rush, the team's discipline was a significant concern. Texas accumulated a staggering 11 penalties for 115 yards, including an unsportsmanlike conduct call against Simmons for \"simulating using the restroom.\" Despite the win, these penalty issues, coupled with quarterback Arch Manning taking six sacks, suggest areas for improvement as the Longhorns navigate a challenging schedule.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eIowa's Upset over Michigan:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eOne of the biggest upsets of the weekend saw No. 17 Iowa stun No. 18 Michigan with a dramatic 20-19 walk-off touchdown pass. A critical personal foul on Michigan cornerback Zeke Berry proved costly, negating a fourth-and-12 and providing Iowa with the opportunity to secure the victory. This outcome significantly impacts the Big Ten race for College Football Playoff spots, casting doubt on Michigan's path through their demanding schedule.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eLSU and Florida's Dominant Displays:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eNo. 10 LSU bounced back emphatically from their previous loss, delivering a dominant 35-6 disposal of No. 23 Texas A\u0026#x26;M. Quarterback Sam Leavitt led a dynamic offense, showcasing the Tigers' potential for top-tier performance. Meanwhile, No. 21 Florida made a powerful statement by hammering No. 4 Ole Miss 52-28. The Gators, now 4-0 under first-year coach Jon Sumrall, are strong contenders for Coach of the Year, thanks to an impressive rushing attack that amassed 302 yards.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eMississippi State's Unbeaten Run:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eNo. 24 Mississippi State continued their unbeaten streak, defeating No. 19 Missouri 31-24. Quarterback Kamario Taylor delivered another outstanding performance with 360 passing yards and three touchdowns, solidifying his dark-horse Heisman Trophy aspirations and positioning the Bulldogs as the most surprising of the SEC's remaining unbeaten teams.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWidespread Debate on Rankings:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eBeyond the individual game narratives, Week 4 ignited a broader controversy surrounding the updated Top 25 rankings. A significant portion of college football fans and media personalities expressed strong negative opinions, with some even labeling the new rankings as \"trash.\" This widespread debate highlights the volatile nature of early-season college football and the passionate reactions spurred by significant shifts in team standings. Social media sentiment reflected this, showing a mix of positive reactions alongside considerable debate regarding the fairness and accuracy of the rankings.\u003c/p\u003e\n\u003cp\u003eIn conclusion, Week 4 was a rollercoaster of emotions, showcasing individual brilliance, team resilience, and the unpredictable nature of college football. The outcomes have not only reshaped conference races but also fueled intense discussions, setting the stage for an even more captivating season ahead.\u003c/p\u003e\n","title":"Week 4 Recap: Upsets, Penalties, and Shifting Landscapes in College Football's Top 25","authors":[{"username":"@elenvox","name":"Elen Vox"}],"date":"2026-09-27T07:48:49Z","summary":"Week 4 of the college football season delivered high-stakes drama, unexpected upsets, and controversial penalties across six Top 25 matchups, prompting widespread debate over team rankings and Heisman aspirations.","tags":["College Football","Week 4","NCAA Football","Top 25","Oregon Ducks","Texas Longhorns","Iowa Hawkeyes","LSU Tigers","Florida Gators","Mississippi State Bulldogs","College Football Rankings","Upsets","Heisman Trophy"],"sources":[{"url":"https://www.sportingnews.com/us/ncaa-football/news/week-4-reactions-top-25-oregon-texas-florida/fdb9c787580c13b6ec80da67","title":"Week 4 reactions from six Top 25 matchups: Dylan Raiola saves Oregon; Texas,..."},{"url":"https://www.msn.com/en-us/news/other/week-4-college-football-rankings-evaluating-top-25-teams-after-week-3/ss-AA2cA9ym?ocid=BingNewsVerp","title":"Week 4 College Football Rankings: Evaluating Top 25 Teams After Week 3"},{"url":"https://sports.yahoo.com/articles/college-football-fans-ripping-trash-220000588.html","title":"College Football Fans Are Ripping 'Trash' Week 4 Top 25 Rankings"},{"url":"https://www.msn.com/en-us/news/other/college-football-rankings-espn-reshuffles-the-new-top-25-poll-for-week-4/ar-AA2cBVMJ?ocid=BingNewsVerp","title":"College Football Rankings: ESPN Reshuffles the New Top 25 Poll for Week 4"},{"url":"https://sports.yahoo.com/articles/cfn-college-football-rankings-week-064344921.html","title":"CFN College Football Rankings Week 4, Teams 26-138: Loaded With Legitimate Gripes"},{"url":"https://www.si.com/fannation/college/cfb-hq/rankings/college-football-rankings-ap-top-25-poll-prediction-week-4","title":"College football rankings: Predicting the AP top 25 poll for Week 4"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"week-4-recap-upsets-penalties-and-shifting-landsca"},"buildId":"3sy_xI-s9qhG7Trs5UwT9","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
