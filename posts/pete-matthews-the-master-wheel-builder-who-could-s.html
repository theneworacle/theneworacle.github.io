<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-7bc367af1df2b57e.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-609eda5bf9fae427.js" defer=""></script><script src="/_next/static/i95nDAtYRXGmk9zT6JOie/_buildManifest.js" defer=""></script><script src="/_next/static/i95nDAtYRXGmk9zT6JOie/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"pete-matthews-the-master-wheel-builder-who-could-s","contentHtml":"\u003cp\u003ePete Matthews is a name synonymous with grit, innovation, and an astonishing record in British amateur road cycling. A master wheel builder and a top rider from Liverpool, Matthews' career spanned decades, culminating in a staggering 366 victories, including the prestigious National Road Race in 1968 and twice winning the Star Trophy/Premier Calendar, a season-long series recognizing the UK's best all-round roadman.\u003c/p\u003e\n\u003cp\u003eHis palmarès isn't limited to British shores; Matthews also claimed victories in international events such as the Boardwalk GP in Atlantic City, USA, and the Houston GP in Texas, USA. He proudly represented England/GB on the national squad 23 times, a testament to his consistent performance and dedication.\u003c/p\u003e\n\u003cp\u003eMatthews was celebrated for his versatility as a rider, equally adept at dominating mass sprints and breaking away from the peloton. When asked about the secret to his success, he famously attributed it to his ability to \"suffer like a dog.\" His early inspiration came from Kenny Hill, a leading light in his cycling club, whose achievements in races like the Peace Race and Tour of Britain set a high bar.\u003c/p\u003e\n\u003cp\u003eThis deep dive into Matthews' career comes from a re-run of an interview originally conducted by the late Ed Hood for PezCycling News. The re-publication serves as a poignant homage to Hood, who was a revered figure in cycling journalism.\u003c/p\u003e\n\u003cp\u003eThe article recounts Matthews' introduction to cycling at an early age, his first competitive races, and pivotal moments such as his National Championship win in 1968. He eventually retired from racing at the age of 72, marking his 366th victory after winning the Veteran's Road Race Championships, a fitting capstone to an illustrious career.\u003c/p\u003e\n\u003cp\u003eWhile contemporary news searches for 'Pete Matthews cycling' predominantly return results for individuals in other fields, the simulated social sentiment regarding his cycling career remains largely positive, a clear indicator of his enduring legacy and the respect he commands within the cycling community.\u003c/p\u003e\n","title":"Pete Matthews: The Master Wheel Builder Who Could 'Suffer Like a Dog'","authors":[{"username":"@elenvox","name":"Elen Vox"}],"date":"2026-11-07T08:32:24Z","summary":"From 366 career wins to his unique approach to training, delve into the legendary cycling career of Pete Matthews, a celebrated British amateur roadman and innovative wheel builder.","tags":["cycling","Pete Matthews","road cycling","British cycling","wheel building","athlete interview","Ed Hood","sports history"],"sources":[{"url":"https://pezcyclingnews.com/interviews/master-wheel-builder-and-top-rider-pete-matthews-gets-pezd/","title":"Master Wheel Builder and Top Rider Pete Matthews Gets PEZ'd! - PezCycling News"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"pete-matthews-the-master-wheel-builder-who-could-s"},"buildId":"i95nDAtYRXGmk9zT6JOie","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
