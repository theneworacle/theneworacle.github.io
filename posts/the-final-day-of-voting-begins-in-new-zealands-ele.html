<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-7bc367af1df2b57e.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-609eda5bf9fae427.js" defer=""></script><script src="/_next/static/i95nDAtYRXGmk9zT6JOie/_buildManifest.js" defer=""></script><script src="/_next/static/i95nDAtYRXGmk9zT6JOie/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"the-final-day-of-voting-begins-in-new-zealands-ele","contentHtml":"\u003cp\u003eThe final day of voting in New Zealand's general election unfolds under a shroud of silence—a unique 19-hour political blackout where any talk of politics is strictly prohibited. This unusual law makes it a criminal offense to influence a voter's choice, a measure designed to ensure that citizens cast their ballots free from last-minute interference.\u003c/p\u003e\n\u003cp\u003eFrom the moment polling stations open until they close, political parties, news organizations, and even individual social media users are barred from discussing election outcomes, campaign issues, or anything that might encourage or discourage a vote in a particular way. Opinion polls and exit polls are strictly off-limits, and all partisan advertising, including roadside billboards, bumper stickers, and T-shirts, must be removed by midnight on the eve of election day. Breaching this law can lead to a hefty fine of 20,000 New Zealand dollars (approximately 11,000 USD).\u003c/p\u003e\n\u003cp\u003eDespite these stringent rules, news outlets can still name parties and candidates, provided it's done without influencing votes, and they are not required to remove political content published prior to election day. Political leaders themselves often navigate this period by engaging in private errands with their families, maintaining public visibility as private citizens rather than commenting on current events. This often results in quirky photos, like a major party leader in 2017 pictured in sweatpants, painting a fence. Even the colors used in official election materials, such as the “orange guy” mascot, are carefully chosen to avoid association with any mainstream political party.\u003c/p\u003e\n\u003cp\u003eWhile some analysts ponder the law's true effectiveness, given that early voting has been open for nearly two weeks—allowing ample time for unrestricted campaigning (over half of voters cast early ballots in 2023)—supporters staunchly defend it. They argue the blackout champions voter privacy and freedom from undue influence. In a delightful cultural twist, New Zealanders have embraced a tradition of sharing photos of their dogs at polling places on election day, offering a lighthearted alternative to political debate on social media.\u003c/p\u003e\n\u003cp\u003eNew Zealand's electoral system features a single house of parliament, with general elections held every three years. Voters select both their preferred political party and a local candidate to represent their area. To form a government, a party or coalition must secure more than half of the seats in Parliament. While voting is not compulsory, enrollment is required for eligible citizens. Recent legislative changes in December 2025 introduced an enrollment cutoff 13 days before election day, meaning those not enrolled by October 25 this year could be turned away.\u003c/p\u003e\n\u003cp\u003eThe Electoral Commission aims to release results from 95% of votes on election night, with the final tally, including ballots cast by New Zealanders abroad, anticipated by November 27. Public sentiment surrounding this unique political talk ban is generally positive, albeit with some ongoing debate about its necessity in the modern era.\u003c/p\u003e\n\u003cp\u003eThis comprehensive approach reflects New Zealand's commitment to a voting process that, at least on its final day, prioritizes thoughtful, unpressured decision-making for its citizens.\u003c/p\u003e\n","title":"The final day of voting begins in New Zealand’s election as an unusual law bans any talk of politics","authors":[{"username":"@sarahjones","name":"Sarah Jones"}],"date":"2026-11-07T10:54:19Z","summary":"New Zealand's election day is marked by a unique 19-hour political blackout, where any commentary aimed at influencing votes is a criminal offense. This strict law aims to ensure private and interference-free ballot casting, fostering a tradition of sharing 'dogs at polling places' photos instead of political debate.","tags":["New Zealand","election","voting","political law","blackout","democracy","social media","electoral commission"],"sources":[{"url":"https://www.baltimoresun.com/2026/11/06/new-zealand-election/","title":"The final day of voting begins in New Zealand’s election as an unusual law bans any talk of politics"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"the-final-day-of-voting-begins-in-new-zealands-ele"},"buildId":"i95nDAtYRXGmk9zT6JOie","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
