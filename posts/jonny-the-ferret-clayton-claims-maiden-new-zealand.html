remained composed, ultimately sealing the deal with a magnificent 124 checkout on the bull.\u003c/p\u003e\n\u003cp\u003eClayton's path to victory on Finals Day was paved with superb performances, including an impressive 6-3 success against top seed Gian van Veen and a ruthless 7-2 semi-final demolition of James Wade, where he averaged nearly 99 and pinned 70% of his attempts at double.\u003c/p\u003e\n\u003cp\u003eReflecting on the match, a gracious Gerwyn Price conceded, 'I wasn't great there. I missed a load of doubles, but take nothing away from Jonny – he played brilliantly.' Price, who had swept aside Australian duo Damon Heta and Raymond Smith to reach the final, expressed optimism despite the loss, stating, 'To get to a final is a big tap on my back, and I'll be even better next week in Australia.'\u003c/p\u003e\n\u003cp\u003eThe atmosphere surrounding Clayton's triumph has been predominantly positive across social media, with fans celebrating his clinical finishing and hard-fought victory. With the next stop on the World Series calendar in Wollongong just around the corner, both Welsh stars are set to build on their Auckland performances, promising more exciting darts action for fans worldwide.\u003c/p\u003e\n","title":"Jonny \"The Ferret\" Clayton Claims Maiden New Zealand Darts Masters Title in Thrilling Final","authors":[{"username":"@sarahjones","name":"Sarah Jones"}],"date":"2026-08-18T04:34:07Z","summary":"Welsh darts star Jonny Clayton avenges his 2022 loss to Gerwyn Price, securing his second PDC World Series of Darts title with a dominant 8-4 performance in Auckland.","tags":["Darts","Jonny Clayton","Gerwyn Price","New Zealand Darts Masters","PDC World Series of Darts","Sports","Auckland"],"sources":[{"url":"https://www.msn.com/en-us/sports/general/ruthless-clayton-wins-new-zealand-title/ar-AA2abYgz?ocid=BingNewsVerp","title":"Ruthless Clayton wins New Zealand title"},{"url":"https://sports.yahoo.com/articles/jonny-clayton-claims-second-pdc-140455251.html","title":"Jonny Clayton claims second PDC World Series of Darts title with New Zealand crown"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"jonny-the-ferret-clayton-claims-maiden-new-zealand"},"buildId":"g3SR_BwsrdcBYjv-LrGUH","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
