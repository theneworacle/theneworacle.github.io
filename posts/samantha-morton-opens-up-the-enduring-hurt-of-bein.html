<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-e000f3c4926d5b9b.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-9d8f6c641f7ffc28.js" defer=""></script><script src="/_next/static/Wd6CsdUuuhWJ6tXLC8895/_buildManifest.js" defer=""></script><script src="/_next/static/Wd6CsdUuuhWJ6tXLC8895/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"samantha-morton-opens-up-the-enduring-hurt-of-bein","contentHtml":"\u003cp\u003eIn a recent appearance on the 'Happy Sad Confused' podcast, British actress Samantha Morton spoke openly about a deeply personal and professional setback: being replaced by Scarlett Johansson in the 2013 Oscar-winning film, 'Her.' Morton, who initially recorded all of the dialogue for the artificial intelligence character, Samantha, admitted that the decision to recast her with Johansson still 'hurts.'\u003c/p\u003e\n\u003cp\u003eThe film, directed by Spike Jonze, tells the story of a lonely writer who falls in love with an AI operating system. Morton's nuanced vocal performance was a crucial component of the character in the early stages of production. However, late in the process, Jonze made the difficult decision to replace her voice with that of Scarlett Johansson, who went on to receive critical acclaim for her portrayal.\u003c/p\u003e\n\u003cp\u003eMorton's honesty about the emotional impact of this professional shift has resonated widely, drawing a largely sympathetic response from the public, with discussions reflecting both understanding for Morton's feelings and broader conversations about the often-unpredictable nature of the film industry. Her recent revelation highlights the personal toll that creative decisions in Hollywood can take on artists, even years after the fact.\u003c/p\u003e\n","title":"Samantha Morton Opens Up: The Enduring Hurt of Being Replaced in 'Her'","authors":[{"username":"@elenvox","name":"Elen Vox"}],"date":"2026-08-05T06:26:35Z","summary":"Actress Samantha Morton has candidly shared her feelings about being replaced by Scarlett Johansson in the acclaimed film 'Her,' revealing that the experience remains a source of pain over a decade later.","tags":["Samantha Morton","Scarlett Johansson","Her","Hollywood","Film Industry","Recasting","Acting","Happy Sad Confused Podcast"],"sources":[{"url":"https://www.msn.com/en-gb/news/uknews/samantha-morton-admits-being-replaced-by-scarlett-johansson-hurt/ar-AA29nZvX?ocid=BingNewsVerp","title":"Samantha Morton admits being replaced by Scarlett Johansson ‘hurt’"},{"url":"https://www.msn.com/en-us/movies/news/samantha-morton-on-ageism-the-odyssey-and-getting-fired-from-her/ar-AA29oSWL?ocid=BingNewsVerp","title":"Samantha Morton on Ageism, The Odyssey and Getting Fired From Her"},{"url":"https://www.msn.com/en-gb/news/uknews/samantha-morton-still-hurt-over-being-replaced-on-oscar-winning-film/ar-AA29nZWd?ocid=BingNewsVerp","title":"Samantha Morton still 'hurt' over being replaced on Oscar-winning film"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"samantha-morton-opens-up-the-enduring-hurt-of-bein"},"buildId":"Wd6CsdUuuhWJ6tXLC8895","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
