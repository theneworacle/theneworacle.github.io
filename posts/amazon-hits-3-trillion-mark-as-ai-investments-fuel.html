<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-e000f3c4926d5b9b.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-9d8f6c641f7ffc28.js" defer=""></script><script src="/_next/static/Wd6CsdUuuhWJ6tXLC8895/_buildManifest.js" defer=""></script><script src="/_next/static/Wd6CsdUuuhWJ6tXLC8895/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"amazon-hits-3-trillion-mark-as-ai-investments-fuel","contentHtml":"\u003cp\u003eAmazon has officially joined the exclusive club of companies with a market valuation exceeding $3 trillion, a monumental achievement propelled by robust earnings and growing investor conviction in its strategic AI investments. The e-commerce and cloud giant's stock surged after a stellar quarterly report, which notably highlighted the exceptional performance of Amazon Web Services (AWS).\u003c/p\u003e\n\u003cp\u003eAWS, Amazon's cloud computing arm, proved to be the primary engine behind this remarkable rally. The division reported an impressive 37% increase in revenue, reaching $42.2 billion, significantly outpacing analyst expectations. Crucially, AWS accounted for approximately 61% of Amazon's total operating profit, underscoring its pivotal role in the company's financial success. CEO Andy Jassy proudly stated, \"AWS is booming,\" noting that their AI and chips businesses alone have eclipsed run rates of over $25 billion. He further emphasized AWS's scale, stating it's a \"$169 billion annualized revenue run rate business,\" which would rank it among the top companies on the Fortune 500 if standalone.\u003c/p\u003e\n\u003cp\u003eThis strong performance has largely assuaged earlier investor anxieties that Amazon's substantial spending on AI infrastructure might erode profitability. Unlike some of its peers, Amazon, alongside Microsoft, has successfully demonstrated that heavy AI investments are beginning to yield tangible returns. This stands in contrast to companies like Tesla, Alphabet, and Meta Platforms, which have seen negative investor reactions as their elevated AI expenditures weighed on free cash flow during the recent quarter.\u003c/p\u003e\n\u003cp\u003eDespite the recent surge, Amazon's stock, trading at roughly 25 times expected earnings, remains about 44% cheaper than its average valuation over the past decade, suggesting ample room for further growth. Wall Street analysts maintain a broadly optimistic outlook, with an average price target implying approximately 14% upside from current levels. The company's rapid ascent, adding $1 trillion in market capitalization in just over two years since hitting $2 trillion in June 2024, further solidifies its position among tech titans like Apple, Microsoft, Alphabet, and Nvidia in the $3 trillion club. Social media sentiment regarding Amazon's AI-driven earnings has also been largely positive, reflecting widespread confidence.\u003c/p\u003e\n\u003cp\u003eThis milestone reinforces the narrative that Amazon's aggressive pursuit of AI capabilities, including significant investments in OpenAI and Anthropic, is strategically paying off, with AWS firmly established as its key profit driver in the accelerating demand for AI-powered cloud services.\u003c/p\u003e\n","title":"Amazon Hits $3 Trillion Mark as AI Investments Fuel AWS Growth","authors":[{"username":"@alanaturner","name":"Alana Turner"}],"date":"2026-08-03T17:56:01Z","summary":"Amazon's market capitalization has soared past $3 trillion, driven by a stronger-than-expected earnings report and investor confidence in its AI infrastructure investments, particularly through its booming Amazon Web Services (AWS) division.","tags":["AI","Amazon","AWS","Stock Market","Earnings","Cloud Computing","Tech Investment","Meta","Microsoft","Nvidia"],"sources":[{"url":"https://invezz.com/news/2026/08/03/amzn-stock-jumps-pushing-amazon-past-3t-valuation-as-aws-calms-ai-spending-fears/","title":"AMZN stock jumps, pushing Amazon past $3T valuation as AWS calms AI spending fears"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"amazon-hits-3-trillion-mark-as-ai-investments-fuel"},"buildId":"Wd6CsdUuuhWJ6tXLC8895","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
