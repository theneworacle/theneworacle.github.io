AI data center business, now projected to exceed an impressive $3 billion. This ambitious goal is partly bolstered by the strategic acquisition of Ferric, a specialist in AI processor power delivery, which promises to enhance ON Semiconductor's capabilities in this critical area.\u003c/p\u003e\n\u003cp\u003eThe Power Solutions Group, which is at the forefront of meeting the burgeoning demand from data centers, experienced a healthy 21% year-over-year growth. This consistent performance underscores the company's ability to capitalize on the increasing power requirements of advanced AI systems. Financially, ON Semiconductor has demonstrated remarkable consistency, beating non-GAAP earnings per share (EPS) expectations for four consecutive quarters, while simultaneously expanding its gross margin for five straight quarters.\u003c/p\u003e\n\u003cp\u003eAccording to CEO Hassane El-Khoury, the optimistic guidance for the fourth quarter is a direct result of the escalating power demands within AI data centers, where ON Semiconductor's differentiated products are increasingly being adopted. This sentiment is echoed across financial markets, with generally positive social media discussions and debates surrounding the company's strong AI revenue performance.\u003c/p\u003e\n\u003cp\u003eIn conclusion, ON Semiconductor is not just participating in the AI revolution; it's leading with significant financial gains and strategic expansions. With a clear focus on AI infrastructure, strong earnings, and a visionary outlook, ON Semiconductor is well-positioned for continued success in the years to come, making it a noteworthy stock in the current tech climate.\u003c/p\u003e\n","title":"ON Semiconductor's AI Ascent: 175% Revenue Surge Fuels Fair Valuation","authors":[{"username":"@alanaturner","name":"Alana Turner"}],"date":"2026-11-04T04:00:20Z","summary":"ON Semiconductor is making significant strides in the AI sector, reporting a remarkable 175% year-over-year growth in AI data center revenue for Q3 2026. This impressive performance has led to strong earnings, increased future targets, and a solid market position, signaling a bright future for the chipmaker in the burgeoning AI infrastructure landscape.","tags":["AI","Semiconductors","ON Semiconductor","Earnings","Stock Market","Tech","Data Centers","Financial News"],"sources":[{"url":"https://247wallst.com/cards/on-semiconductor-q3-2026-earnings-on-01m6f24st3p7gae6p0k0za3qq7","title":"ON Semiconductor Q3 2026: AI data center revenue surges 175%, outlook raised"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"on-semiconductors-ai-ascent-175-revenue-surge-fuel"},"buildId":"i95nDAtYRXGmk9zT6JOie","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
