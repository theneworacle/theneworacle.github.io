<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-e000f3c4926d5b9b.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-9d8f6c641f7ffc28.js" defer=""></script><script src="/_next/static/cqH2wsk4pgarRe2mifYn9/_buildManifest.js" defer=""></script><script src="/_next/static/cqH2wsk4pgarRe2mifYn9/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"springboks-dominate-all-blacks-in-historic-baltimo","contentHtml":"\u003cp\u003eIn a truly historic encounter, the South African Springboks delivered a dominant performance against their fierce rivals, the New Zealand All Blacks, in the deciding 4th Test of the 'Rugby's Greatest Rivalry' series. Played on American soil for the very first time, at Baltimore's M\u0026#x26;T Bank Stadium, the Springboks emerged victorious with a commanding 47-28 win, securing the series 3-1.\u003c/p\u003e\n\u003cp\u003eThe match was not only a showcase of world-class rugby but also a landmark event for the sport in North America, drawing a record-breaking crowd of 68,173 spectators. This incredible turnout underscores the growing appeal of rugby beyond its traditional strongholds.\u003c/p\u003e\n\u003cp\u003eComing into the decider, South Africa held a 2-1 lead, having bounced back strongly after losing the opening test. Their consistency, power, and cohesion proved too much for the All Blacks in Baltimore. Key players such as Kurt-Lee Arendse were instrumental in the Springboks' decisive victory, with Arendse scoring a crucial try that further cemented their lead.\u003c/p\u003e\n\u003cp\u003eBoth teams faced significant challenges with injuries. The All Blacks were notably without captain Ardie Savea due to a dislocated shoulder, and Quinn Tupaea, Luke Jacobson, and Fabian Holland also missed out. The Springboks, too, had to contend without star back Cheslin Kolbe, who suffered a broken jaw. Despite these setbacks, both squads delivered a pulsating display of rugby.\u003c/p\u003e\n\u003cp\u003eThe social sentiment surrounding the match was overwhelmingly positive, with fans and commentators celebrating the high-quality rugby and the impressive attendance. While there was some debate on various aspects, the overall consensus highlighted the success of bringing such a prestigious rivalry to a new audience.\u003c/p\u003e\n\u003cp\u003eThe Baltimore Test will undoubtedly be remembered as a pivotal moment, not just for the Springboks' emphatic series win, but also for its contribution to expanding rugby's footprint and thrilling new fans across North America.\u003c/p\u003e\n","title":"Springboks Dominate All Blacks in Historic Baltimore Clash, Clinching Series 3-1","authors":[{"username":"@sarahjones","name":"Sarah Jones"}],"date":"2026-09-17T09:10:48Z","summary":"South Africa's Springboks secured a resounding 3-1 series victory over New Zealand's All Blacks in a monumental 4th Test held in Baltimore, USA. The match, which ended 47-28, set a new North American rugby attendance record and marked a significant moment for the sport's growth in the region.","tags":["Rugby","South Africa","New Zealand","Springboks","All Blacks","Baltimore","Sports","Record Attendance","Rugby's Greatest Rivalry"],"sources":[{"url":"https://www.msn.com/en-us/news/other/south-africa-cap-series-victory-over-nz-with-baltimore-win/ar-AA2c5Tuj","title":"South Africa cap series victory over NZ with Baltimore win"},{"url":"https://www.nytimes.com/athletic/7578089/2026/09/10/south-africa-new-zealand-rugby-baltimore-why/","title":"South Africa vs New Zealand is rugby's 'money game'. Why is it being played in the U.S?"},{"url":"https://www.theguardian.com/sport/2026/sep/13/south-africa-new-zealand-greatest-rivalry-rugby-union-match-report","title":"Flying Kurt-Lee Arendse helps South Africa clinch New Zealand series"},{"url":"https://www.nytimes.com/athletic/7588351/2026/09/12/new-zealand-south-africa-rugby-baltimore-record-attendance/","title":"South Africa runs over New Zealand in front of North American record 68,173 in Baltimore rugby match"},{"url":"https://www.baltimoresun.com/2026/09/11/new-zealand-south-africa-springboks-all-blacks-rugby-baltimore/","title":"Springboks-All Blacks rugby match in Baltimore to set North American crowd record"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"springboks-dominate-all-blacks-in-historic-baltimo"},"buildId":"cqH2wsk4pgarRe2mifYn9","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
