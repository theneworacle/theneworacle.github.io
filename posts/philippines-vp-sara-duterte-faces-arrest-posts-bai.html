<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-e000f3c4926d5b9b.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-9d8f6c641f7ffc28.js" defer=""></script><script src="/_next/static/g3SR_BwsrdcBYjv-LrGUH/_buildManifest.js" defer=""></script><script src="/_next/static/g3SR_BwsrdcBYjv-LrGUH/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"philippines-vp-sara-duterte-faces-arrest-posts-bai","contentHtml":"\u003cp\u003eA high-stakes political drama is unfolding in the Philippines as Vice President Sara Duterte recently posted bail following an arrest warrant issued against her. The charges stem from three counts of 'grave threats,' allegedly made during a 2024 online news conference where she reportedly threatened to have President Ferdinand Marcos Jr., his wife Liza Marcos, and then-House Speaker Martin Romualdez killed if she herself were to be assassinated.\u003c/p\u003e\n\u003cp\u003eDuterte, who denies the allegations, appeared at the Quezon City Regional Trial Court to post a P360,000 bail ($5,740) for the three charges. Emerging from the courthouse, she voiced significant concerns for her personal safety, citing documented threats and harassment dating back to 2023. \"I do not feel safe with all these police personnel who are harassing those at my home, harassing me since 2023,\" Duterte stated, adding, \"What does this administration really want to do with me?\"\u003c/p\u003e\n\u003cp\u003eThis legal battle is widely seen as a major escalation in the deepening political rift between Vice President Duterte and President Marcos Jr. Despite running as an alliance in the 2022 elections, combining two of the country’s most formidable political dynasties, their relationship has since fractured. The Vice President is already facing an impeachment trial in the Senate over allegations of unexplained wealth and misuse of confidential state funds, with this new case adding another layer to her mounting challenges.\u003c/p\u003e\n\u003cp\u003eDuterte's legal team had argued that as an impeachable official, she should be immune from criminal prosecution while in office. However, legal experts have countered this, asserting that unlike the President, the Vice President does not hold such immunity. A conviction in this case could carry severe consequences, potentially disqualifying her from holding public office and barring her from seeking the presidency in 2028, when Marcos's term concludes.\u003c/p\u003e\n\u003cp\u003eThe Vice President's political stance has also put her at odds with the current administration on several key issues. She has been critical of the Marcos administration's cooperation with international bodies regarding her father, former President Rodrigo Duterte, who faces charges at the International Criminal Court. Furthermore, her perceived reluctance to condemn China's aggressive actions in the disputed South China Sea contrasts sharply with President Marcos Jr.'s efforts to strengthen defense ties with the United States.\u003c/p\u003e\n\u003cp\u003ePublic sentiment surrounding the issue remains varied, with discussions on social media indicating a mostly positive response to the developments but also significant debate, reflecting the divisive nature of Philippine politics. As the legal proceedings continue, the nation watches closely to see how this high-profile case will reshape the political landscape.\u003c/p\u003e\n","title":"Philippines VP Sara Duterte Faces Arrest, Posts Bail Over Alleged Assassination Threats","authors":[{"username":"@miguelreyes","name":"Miguel Reyes"}],"date":"2026-09-05T10:22:38Z","summary":"Philippine Vice President Sara Duterte has posted bail after an arrest warrant was issued against her for alleged \"grave threats\" directed at President Ferdinand Marcos Jr., First Lady Liza Marcos, and former House Speaker Martin Romualdez. The development highlights escalating political tensions within the country's top leadership, even as Duterte expresses concerns for her own safety amidst the legal battle.","tags":["Philippines","Sara Duterte","Ferdinand Marcos Jr.","Politics","Legal Issues","Grave Threats","Bail","Assassination Threats","Philippine Government","Impeachment","South China Sea"],"sources":[{"url":"https://www.msn.com/en-us/news/other/philippine-vp-duterte-posts-bail-over-grave-threats-against-marcos/ar-AA2bCaXA?ocid=BingNewsVerp","title":"Philippine VP Duterte posts bail over 'grave threats' against Marcos"},{"url":"https://www.nbcnews.com/world/phillipines/philippines-president-posts-bail-arrest-order-alleged-threats-rcna596218","title":"Philippines vice president posts bail after arrest order for alleged threats against president"},{"url":"https://www.rappler.com/philippines/sara-duterte-bail-grave-threats-case/","title":"Sara Duterte posts bail for grave threats case"},{"url":"https://www.msn.com/en-ph/news/other/qc-court-orders-sara-duterte-s-arrest-in-threats-case/ar-AA2bBnO4?ocid=BingNewsVerp","title":"QC court orders Sara Duterte’s arrest in ‘threats’ case"},{"url":"https://www.msn.com/en-au/news/other/sara-duterte-posts-bail-after-arrest-for-threats-against-marcos-jr/ar-AA2bBJmu?ocid=BingNewsVerp","title":"Sara Duterte posts bail after arrest for ‘threats’ against Marcos Jr"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"philippines-vp-sara-duterte-faces-arrest-posts-bai"},"buildId":"g3SR_BwsrdcBYjv-LrGUH","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
