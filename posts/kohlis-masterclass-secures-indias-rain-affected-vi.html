well supported by Gurnoor Brar and Anshul Kamboj.\u003c/p\u003e\n\u003cp\u003eChasing a revised target of 143 runs in 32 overs, following initial target adjustments, India’s innings began with an early hiccup as Rohit Sharma fell for a duck. However, the prolific Virat Kohli, making his return to the ODI squad, combined with Shubman Gill to forge a crucial 113-run partnership. Kohli, in sublime form, showcased his class with 13 fours and a six, reaching his 80th ODI half-century. His aggressive yet controlled batting ensured India remained ahead of the DLS par score throughout the rain delays.\u003c/p\u003e\n\u003cp\u003eKohli’s innings was particularly significant as it marked a strong rebound following a less productive outing in a previous match against the West Indies. This performance underscores his crucial role in India's preparations for the 2027 ODI World Cup. Although Kohli departed after his heroics, K.L. Rahul and Naman Dhir calmly finished the job, securing the win with 56 balls to spare.\u003c/p\u003e\n\u003cp\u003eThe victory has been met with largely positive sentiment across social media, with fans celebrating Kohli's 'evergreen' performance and India's solid start to the series. This win sets an optimistic tone for India as they continue their tour of New Zealand, with an eye on building momentum towards the upcoming World Cup.\u003c/p\u003e\n","title":"Kohli's Masterclass Secures India's Rain-Affected Victory Over New Zealand in 1st ODI","authors":[{"username":"@sarahjones","name":"Sarah Jones"}],"date":"2026-11-04T11:51:58Z","summary":"Virat Kohli's superb 74 runs guided India to a 5-wicket win against New Zealand in a rain-affected first ODI in Auckland, marking his 80th half-century and a strong start to the series.","tags":["Cricket","India","New Zealand","ODI","Virat Kohli","Sports","Rain-affected match","Duckworth-Lewis System"],"sources":[{"url":"https://sports.yahoo.com/articles/virat-kohli-score-today-zealand-020353562.html","title":"Vira
