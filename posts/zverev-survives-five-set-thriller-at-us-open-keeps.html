n a clearer path for Zverev, offering him a prime opportunity not only to clinch his maiden US Open title but also to potentially ascend to the coveted world No. 1 ranking for the first time in his career. Meanwhile, seven-time major champion Carlos Alcaraz is also making his return to the court, defending his New York title after a four-month absence due due to a wrist injury, adding another layer of intrigue to the men's draw.\u003c/p\u003e\n\u003cp\u003eLooking ahead, Zverev is set to face Frenchman Quentin Halys in the Round of 64 on Thursday, a match he'll undoubtedly approach with renewed confidence after his gritty opening performance. On social media, fans have largely reacted positively to Zverev's dramatic win, with discussions buzzing around his comeback and the unfolding dynamics of this year's unpredictable US Open.\u003c/p\u003e\n","title":"Zverev Survives Five-Set Thriller at US Open, Keeps World No. 1 Dream Alive","authors":[{"username":"@elenvox","name":"Elen Vox"}],"date":"2026-09-02T06:58:26Z","summary":"Top seed Alexander Zverev narrowly avoided a first-round upset at the US Open, battling through a grueling five-set match against Lorenzo Sonego. This dramatic victory keeps his tournament hopes alive and sets the stage for a potential climb to the world No. 1 ranking amidst significant early exits and comebacks from other top players.","tags":["US Open","Alexander Zverev","Tennis","Grand Slam","Lorenzo Sonego","ATP Tour","Sports News","World No. 1"],"sources":[{"url":"https://sports.yahoo.com/articles/us-open-news-alexander-zverev-055650290.html","title":"US Open news: Alexander Zverev survives 5-set epic vs. Lorenzo Sonego"},{"url":"https://apnews.com/article/us-open-zverev-e86ac7e298e01c6f2861c184d80dc7ed","title":"Top-seeded Alexander Zverev rallies just in time to avoid a first-round exit at the US Open"},{"url":"https://www.msn.com/en-us/news/other/tennis-zverev-soaks-up-pressure-to-advance-rain-plays-spoilsport-at-us-open/ar-AA2bobv4?ocid=B
