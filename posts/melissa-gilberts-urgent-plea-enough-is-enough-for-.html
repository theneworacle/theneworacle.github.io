<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-e000f3c4926d5b9b.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-9d8f6c641f7ffc28.js" defer=""></script><script src="/_next/static/g3SR_BwsrdcBYjv-LrGUH/_buildManifest.js" defer=""></script><script src="/_next/static/g3SR_BwsrdcBYjv-LrGUH/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"melissa-gilberts-urgent-plea-enough-is-enough-for-","contentHtml":"\u003cp\u003eMelissa Gilbert, the beloved actress known for her iconic role in 'Little House on the Prairie,' has issued a passionate and urgent call for reform within the child acting industry. Her emotional declaration, 'Enough is enough,' comes in the wake of the deaths of three former child actors in just two years, a statistic she finds deeply troubling and indicative of a larger, systemic problem.\u003c/p\u003e\n\u003cp\u003eGilbert's plea was particularly sparked by the passing of Daveigh Chase, known for her roles in 'Lilo \u0026#x26; Stitch' and 'The Ring.' For Gilbert, a former child star herself, these tragedies hit 'so personal,' underscoring a profound empathy and understanding of the unique pressures and vulnerabilities young performers face. She firmly believes that 'something is very, very wrong' with the current safeguards – or lack thereof – in place for these vulnerable individuals.\u003c/p\u003e\n\u003cp\u003eA significant part of Gilbert's critique is directed at what she terms 'irresponsible stage parenting.' She advocates for a more robust framework of protections to ensure the well-being and future of child stars, suggesting that the industry has a moral obligation to prevent such heartbreaking outcomes. Her powerful statements have resonated widely, drawing considerable media attention and sparking a crucial conversation about the duty of care for young talent.\u003c/p\u003e\n\u003cp\u003eSocial media platforms reflect a largely positive sentiment towards Gilbert's stance, with many users expressing support for her advocacy. While some debate the specifics of how best to implement these changes, the overwhelming consensus points to a shared concern for the mental and physical health of child actors. Gilbert's courage in speaking out is now serving as a catalyst, hopefully pushing the entertainment industry to re-evaluate and fortify the support systems for its youngest stars.\u003c/p\u003e\n","title":"Melissa Gilbert's Urgent Plea: 'Enough Is Enough' for Child Stars","authors":[{"username":"@elenvox","name":"Elen Vox"}],"date":"2026-08-23T03:09:53Z","summary":"Veteran actress Melissa Gilbert is speaking out, demanding better protections for child actors after a tragic series of deaths in the industry, highlighting the personal toll and systemic failures.","tags":["Melissa Gilbert","Child Actors","Hollywood","Entertainment Industry","Mental Health","Advocacy","Celebrity News"],"sources":[{"url":"https://www.msn.com/en-us/entertainment/celebrities/why-melissa-gilbert-finds-young-actresses-deaths-so-personal-enough/ar-AA2aJaQW?ocid=BingNewsVerp","title":"Why Melissa Gilbert finds young actresses' deaths 'so personal': 'Enough'"},{"url":"https://www.msn.com/en-us/tv/celebrity/melissa-gilbert-calls-for-protections-for-child-stars-after-hayden-panettiere-s-death-something-is-very-very-wrong/ar-AA2aJ3oP?ocid=BingNewsVerp","title":"Melissa Gilbert calls for protections for child stars after Hayden Panettiere’s death: ‘Something is very, very wrong’"},{"url":"https://www.yahoo.com/entertainment/celebrity/articles/melissa-gilbert-criticizes-stage-parents-182120322.html","title":"Melissa Gilbert Criticizes Stage Parents After Death of ‘Lilo \u0026 Stitch’ Actor Daveigh Chase: Child Stardom Is ‘Not a Guarantee of Dysfunction’"},{"url":"https://www.yahoo.com/entertainment/celebrity/articles/melissa-gilbert-calls-death-co-160125070.html","title":"Melissa Gilbert Calls Death Of Co-Star Daveigh Chase Heartbreaking, Slams Irresponsible Stage Parenting"},{"url":"https://www.yahoo.com/entertainment/celebrity/articles/melissa-gilbert-issues-urgent-plea-230138771.html","title":"Melissa Gilbert Issues Urgent Plea After Daveigh Chase's Cause of Death Is Revealed"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"melissa-gilberts-urgent-plea-enough-is-enough-for-"},"buildId":"g3SR_BwsrdcBYjv-LrGUH","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
