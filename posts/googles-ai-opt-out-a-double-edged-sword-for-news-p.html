<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-e000f3c4926d5b9b.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-9d8f6c641f7ffc28.js" defer=""></script><script src="/_next/static/mdzc-8the_Msag-5tFbW-/_buildManifest.js" defer=""></script><script src="/_next/static/mdzc-8the_Msag-5tFbW-/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"googles-ai-opt-out-a-double-edged-sword-for-news-p","contentHtml":"\u003cp\u003eNews publishers are facing a critical decision as Google integrates 'Top Stories' carousels directly into its AI Overviews. While seemingly beneficial for visibility, a new AI opt-out setting in Search Console presents a complex challenge: choosing to opt out of Google's AI features may inadvertently cost sites their coveted spot in these high-traffic news carousels.\u003c/p\u003e\n\u003cp\u003eAccording to tracking data from NewzDash, a significant percentage of news searches – 15.5% in the U.S. and 17.46% in the U.K. – now display the 'Top Stories' carousel \u003cem\u003einside\u003c/em\u003e the AI Overview. This placement is considered prime real estate, and for publishers, the implications of exclusion are substantial.\u003c/p\u003e\n\u003cp\u003eGoogle's official stance, as per its help page, indicates that links and content from opted-out sites will not appear in covered AI features. While not explicitly stating the impact on embedded 'Top Stories' carousels, industry experts widely interpret this to mean that opting out would lead to exclusion from these valuable placements within AI Overviews.\u003c/p\u003e\n\u003cp\u003eIt's crucial for publishers to differentiate between the new AI opt-out setting and 'Google-Extended.' The latter primarily controls whether content trains Gemini models and grounds answers in Gemini Apps. Blocking 'Google-Extended' does not, by itself, prevent a publisher from appearing in AI Overviews or 'Top Stories.' The new AI opt-out, however, targets the AI Overview feature itself, where the 'Top Stories' carousels are now frequently embedded.\u003c/p\u003e\n\u003cp\u003eThis development creates a significant dilemma for newsrooms. They must now weigh their philosophical or business objections to Google utilizing their content for AI summaries against the potential loss of valuable news visibility in a prominent search feature. The full impact on clicks and traffic from this trade-off remains largely unknown, adding to the complexity of the decision.\u003c/p\u003e\n\u003cp\u003eAdding to the uncertainty, Google has stated its intention to expand the list of features covered by the AI opt-out setting over time. This means the long-term consequences of opting out could become even more far-reaching. The simulated social sentiment around this topic is \"mostly positive,\" albeit with \"some debate,\" indicating a mixed reaction across the public and industry, highlighting the ongoing tension between technological advancement and content control.\u003c/p\u003e\n\u003cp\u003eAs the digital landscape continues to evolve with AI at its forefront, publishers must carefully consider their strategies for maintaining visibility and control over their valuable content in Google Search.\u003c/p\u003e\n","title":"Google's AI Opt-Out: A Double-Edged Sword for News Publishers","authors":[{"username":"@alanaturner","name":"Alana Turner"}],"date":"2026-08-03T07:31:08Z","summary":"Google's new AI opt-out setting could remove your site from prominent 'Top Stories' carousels when they appear within AI Overviews, creating a significant dilemma for news publishers weighing content control against search visibility.","tags":["AI","Google","Search Engine Optimization","News Publishers","AI Overviews","Top Stories","Content Control","Digital Publishing"],"sources":[{"url":"https://www.searchenginejournal.com/ai-opt-out-may-cost-publishers-a-top-stories-spot/584016/","title":"AI Opt-Out May Cost Sites A Google Top Stories Spot"},{"url":"https://www.searchenginejournal.com/google-gives-sites-ai-search-opt-out-but-not-the-data-to-use-it/577978/","title":"Google Gives Sites AI Search Opt-Out, But Not The Data To Use It"},{"url":"https://www.wired.com/story/how-to-opt-out-of-google-search-new-ai-data-training/","title":"Here’s How to Opt Out of Google Search’s New AI Data Training Feature"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"googles-ai-opt-out-a-double-edged-sword-for-news-p"},"buildId":"mdzc-8the_Msag-5tFbW-","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
