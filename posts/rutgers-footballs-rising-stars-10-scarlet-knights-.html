<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-e000f3c4926d5b9b.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-9d8f6c641f7ffc28.js" defer=""></script><script src="/_next/static/Wd6CsdUuuhWJ6tXLC8895/_buildManifest.js" defer=""></script><script src="/_next/static/Wd6CsdUuuhWJ6tXLC8895/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"rutgers-footballs-rising-stars-10-scarlet-knights-","contentHtml":"\u003cp\u003eRutgers Football is buzzing with excitement as ten of its talented players have earned a coveted spot on the 2027 Shriners Children's East-West Bowl 1000 Watch List. This exclusive list identifies the top 1000 college football players across the nation who possess the strongest potential for an NFL career and are eligible for the upcoming East-West Bowl.\u003c/p\u003e\n\u003cp\u003eThe Scarlet Knights recognized for their exceptional talent include a strong mix of offensive and defensive powerhouses. On the offensive line, Kwabena Asamoah and Tyler Needham have been named, with Needham bringing a wealth of experience from his 32 games played for Rutgers. Wide receiver KJ Duff and running back Antwan Raymond also made the cut, with all three of these players consistently appearing on various preseason watch lists.\u003c/p\u003e\n\u003cp\u003eThe defensive side of the ball is well-represented, especially with key transfers making a significant impact. Defensive linemen J'Dan Burnett (EDGE, transfer from Tulsa), Malachi Davis (EDGE, transfer from Toledo), and Rondo Porter (DT, transfer from Appalachian State) are all on the list. Burnett and Davis showcased impressive numbers at their previous schools, each recording 9.5 tackles-for-loss and 6.5 and 5.5 sacks, respectively. Davis also earned third-team All-MAC honors. Porter contributed 43 tackles, five for loss, and two sacks at Appalachian State. Linebacker Ty Morris, a transfer from Rice, also had a standout season with 88 tackles and 9.5 for loss. Rounding out the defensive selections is defensive back Kaj Sanders, who is expected to have a bounce-back season under the new coaching staff.\u003c/p\u003e\n\u003cp\u003eAdding to the excitement, quarterback Dylan Lonergan, a transfer from Boston College, is also on the watch list. He completed 190 of 284 passes for 2,025 yards and 12 touchdowns last season and is currently in contention for the starting quarterback role at Rutgers.\u003c/p\u003e\n\u003cp\u003eThe inclusion of these ten Scarlet Knights on such a prominent watch list is a testament to the program's growing talent and potential. Social media sentiment has been largely positive, reflecting the optimism surrounding Rutgers Football's prospects for the upcoming season and beyond.\u003c/p\u003e\n","title":"Rutgers Football's Rising Stars: 10 Scarlet Knights Named to Elite Watch List","authors":[{"username":"@elenvox","name":"Elen Vox"}],"date":"2026-08-05T02:05:35Z","summary":"A significant achievement for Rutgers Football as ten of its players have been named to the prestigious 2027 Shriners Children's East-West Bowl 1000 Watch List, highlighting their potential NFL futures.","tags":["Rutgers Football","College Football","NFL Draft","East-West Bowl","Watch List","Scarlet Knights","Football Prospects","NCAA"],"sources":[{"url":"https://www.msn.com/en-us/sports/other/10-rutgers-football-players-named-to-east-west-bowl-1000-watch-list/ar-AA28FBdZ?ocid=BingNewsBrowse","title":"10 Rutgers football players named to East-West Bowl 1000 watch list"},{"url":"https://sports.yahoo.com/articles/10-rutgers-football-players-selected-050305774.html","title":"10 Rutgers Football Players Selected to 2027 Shriners Children’s East-West Bowl 1000 Watch List"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"rutgers-footballs-rising-stars-10-scarlet-knights-"},"buildId":"Wd6CsdUuuhWJ6tXLC8895","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
