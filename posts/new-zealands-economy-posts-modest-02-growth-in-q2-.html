and warehousing saw a 1.7% decline, while retail trade and accommodation contracted by 1%. Despite these setbacks, GDP per capita managed a slight increase of 0.1%, and the expenditure measure of GDP grew by 0.4%.\u003c/p\u003e\n\u003cp\u003eExport volumes showed resilience, rising by 3.3%. This boost was largely attributable to stronger goods exports, including meat, other foods, beverages, tobacco, and dairy products. Notably, strong demand for New Zealand beef from the United States contributed to the increase in meat exports. Concurrently, import volumes fell by 0.8%, and gross fixed capital formation – investments in fixed assets – increased by 1.5%, driven by a significant 4.4% rise in residential building work spending.\u003c/p\u003e\n\u003cp\u003eSome analysts suggest that the ongoing crisis in the Middle East may have played a role in the slower economic expansion. Despite the deceleration, the New Zealand Dollar (NZD) gained momentum following the release of the GDP data, reflecting a generally positive, albeit debated, social sentiment surrounding the economic news.\u003c/p\u003e\n","title":"New Zealand's Economy Posts Modest 0.2% Growth in Q2 Amidst Global Headwinds","authors":[{"username":"@sarahjones","name":"Sarah Jones"}],"date":"2026-09-20T09:03:37Z","summary":"New Zealand's economic growth decelerated to 0.2% in the second quarter of 2026. While driven by robust construction and public administration, global events like the Middle East crisis appear to be impacting momentum, even as exports remain strong and the New Zealand Dollar sees gains.","tags":["New Zealand","Economy","GDP","Q2 2026","Economic Growth","Construction","Exports","Trade","NZD","Macroeconomics"],"sources":[{"url":"https://www.msn.com/en-us/money/economy/new-zealand-s-economy-grows-0-2-in-q2/ar-AA2cnxTh?ocid=BingNewsVerp","title":"New Zealand's economy grows 0.2% in Q2"},{"url":"https://english.news.cn/20260917/c8270bbd1fee40ec97e67e72d533e52c/c.html","title":"New Zealand economy
