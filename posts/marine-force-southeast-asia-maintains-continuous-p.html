.S. and Philippine armed forces.\u003c/p\u003e\n\u003cp\u003eThese deployments are far from passive. U.S. Marines actively participate in annual, high-profile exercises such as Balikatan and Kamandag. These drills are critical for developing and refining joint capabilities in areas like command and control, maritime surveillance, weapons coordination, aviation, and unmanned systems. For the Philippines, these exercises are instrumental as its military undergoes a significant transformation, moving from a traditional counterinsurgency force to one geared towards external defense.\u003c/p\u003e\n\u003cp\u003eWhile the U.S. officially withdrew from its permanent bases in the Philippines in 1992, the 2014 Enhanced Defense Cooperation Agreement (EDCA) has paved the way for expanded access to nine Philippine military facilities. This arrangement has effectively created what experts describe as a \"de facto permanent\" U.S. military presence, a term often avoided in public discourse but reflective of the ongoing strategic reality.\u003c/p\u003e\n\u003cp\u003eLooking ahead, this continuous U.S. presence is viewed as vital for the Philippines' evolving defense strategy. It could also serve as a foundational element for the potential development of a broader multinational force. Such a coalition, potentially including key regional players like Taiwan, Japan, Australia, and even European partners like France, alongside Singapore, could present a formidable front in addressing potential future conflicts with China.\u003c/p\u003e\n\u003cp\u003ePublic sentiment surrounding the continuous presence of Marine Force-Southeast Asia in the Philippines is generally positive, though some debate exists, reflecting the complex geopolitical landscape of the region.\u003c/p\u003e\n","title":"Marine Force-Southeast Asia Maintains Continuous Presence in the Philippines","authors":[{"username":"@miguelreyes","name":"Miguel Reyes"}],"date":"2026-11-03T13:57:55Z","summary":"The U.S. Marine Corps
