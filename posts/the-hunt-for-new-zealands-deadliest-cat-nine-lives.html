<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-e000f3c4926d5b9b.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-9d8f6c641f7ffc28.js" defer=""></script><script src="/_next/static/g3SR_BwsrdcBYjv-LrGUH/_buildManifest.js" defer=""></script><script src="/_next/static/g3SR_BwsrdcBYjv-LrGUH/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"the-hunt-for-new-zealands-deadliest-cat-nine-lives","contentHtml":"\u003cp\u003eNew Zealand's long-standing battle against invasive predators has marked a significant victory with the killing of 'Nine Lives,' a feral cat notoriously dubbed the nation's 'deadliest.' This elusive feline was held responsible for the devastating decline of the local pāteke (brown teal) duck population on the Purerua Peninsula in the northern Bay of Islands, reportedly wiping out approximately three-quarters of the released birds.\u003c/p\u003e\n\u003cp\u003eThe hunt for 'Nine Lives' was an arduous effort, spanning an intense three-year period. The conservation community and local authorities alike will breathe a sigh of relief as this threat to native wildlife is finally neutralized. CNN, with reporter Antoinette Radford, even joined the pursuit in January, highlighting the national and international attention the issue garnered.\u003c/p\u003e\n\u003cp\u003eThe elimination of 'Nine Lives' underscores New Zealand's unwavering commitment to protecting its unique biodiversity from introduced species. This campaign is crucial for the survival of many native birds and animals that evolved without the presence of such predators.\u003c/p\u003e\n\u003cp\u003eSocial media reaction to the news has been largely positive, with many applauding the efforts to safeguard New Zealand's precious wildlife. While some debate on the ethics of such measures exists, the prevailing sentiment supports the critical conservation work being undertaken.\u003c/p\u003e\n","title":"The Hunt for New Zealand's Deadliest Cat, 'Nine Lives,' Concludes","authors":[{"username":"@sarahjones","name":"Sarah Jones"}],"date":"2026-08-05T04:16:13Z","summary":"After a three-year pursuit, New Zealand's infamous feral cat, 'Nine Lives,' responsible for decimating the rare pāteke duck population, has been killed as part of the nation's intensive predator control efforts.","tags":["New Zealand","conservation","feral cats","pāteke ducks","wildlife","predator control","invasive species"],"sources":[{"url":"https://www.cnn.com/2026/08/04/world/video/hunt-for-new-zealands-deadliest-cat-is-over-digvid-vrtc","title":"The hunt for New Zealand’s deadliest cat is finally over"},{"url":"https://www.msn.com/en-nz/news/national/wildlife-devouring-feral-cat-nine-lives-caught-after-three-year-effort/ar-AA29glpe?ocid=BingNewsVerp","title":"Wildlife-devouring feral cat 'Nine Lives' caught after three-year effort"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"the-hunt-for-new-zealands-deadliest-cat-nine-lives"},"buildId":"g3SR_BwsrdcBYjv-LrGUH","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
