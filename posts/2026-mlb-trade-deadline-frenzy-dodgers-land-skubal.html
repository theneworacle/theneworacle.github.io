<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-e000f3c4926d5b9b.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-9d8f6c641f7ffc28.js" defer=""></script><script src="/_next/static/mdzc-8the_Msag-5tFbW-/_buildManifest.js" defer=""></script><script src="/_next/static/mdzc-8the_Msag-5tFbW-/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"2026-mlb-trade-deadline-frenzy-dodgers-land-skubal","contentHtml":"\u003cp\u003eThe 2026 Major League Baseball trade deadline delivered on its promise of drama and significant roster shake-ups. With only a handful of teams truly out of contention, a unique environment emerged, leading to unexpected sellers, bold moves by contenders, and even some inter-contender trading.\u003c/p\u003e\n\u003cp\u003eThe undisputed biggest name on the market, two-time reigning AL Cy Young winner Tarik Skubal, was the prize jewel of this deadline. The Detroit Tigers, falling in the AL standings, ultimately sent their ace to the Los Angeles Dodgers, who are eyeing a historic three-peat. This blockbuster deal gives the Dodgers arguably the best pitcher in baseball for their playoff push, while the Tigers secured valuable prospects Zyhir Hope, River Ryan, and Brady Smith.\u003c/p\u003e\n\u003cp\u003eElsewhere, the \u003cstrong\u003ePhiladelphia Phillies\u003c/strong\u003e were among the most active buyers, demonstrating a clear intent to go all-in. They first landed second baseman Luis Arraez, one of baseball's top contact hitters, and reliever Caleb Kilian from the Giants. Not content, the Phillies further bolstered their bullpen by acquiring Brooks Raley from the Mets, continuing a busy period for New York's relief corps. In return, the Giants received prospects Ramon Marquez and Marty Gair from the Phillies for Arraez and Kilian.\u003c/p\u003e\n\u003cp\u003eThe \u003cstrong\u003eToronto Blue Jays\u003c/strong\u003e also made waves, fortifying their rotation by acquiring starter Jose Soriano from the Angels. Soriano, enjoying a breakout season and under contract through 2028, cost the Blue Jays prospects Arjun Nimmala, Eddie Micheletti, and Angel Rivero. The Blue Jays also traded veteran starter Kevin Gausman to the Chicago Cubs for prospects Brett Bateman and Ty Southisene.\u003c/p\u003e\n\u003cp\u003eOther notable transactions and persistent rumors included:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eThe \u003cstrong\u003eWhite Sox\u003c/strong\u003e added reliever Huascar Brazoban from the Mets.\u003c/li\u003e\n\u003cli\u003eThe \u003cstrong\u003eAtlanta Braves\u003c/strong\u003e acquired starter Tyler Mahle from the Giants for pitching prospect Anthony Molina and also added the quality right-handed bat of Thomas in a deal with Kansas City.\u003c/li\u003e\n\u003cli\u003eThe \u003cstrong\u003eYankees\u003c/strong\u003e, grappling with an offense that struggled without Aaron Judge, made a move for a slugging first baseman and traded Doval to the Pittsburgh Pirates.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eFreddy Peralta\u003c/strong\u003e's tenure with the Mets came to an end as he was traded to the Rays for prospects Aidan Smith, Gary Gill Hill, and Emilien Pitre.\u003c/li\u003e\n\u003cli\u003eThe \u003cstrong\u003eGiants\u003c/strong\u003e were reportedly asking for a significant return for shortstop prospect Neto.\u003c/li\u003e\n\u003cli\u003eThe \u003cstrong\u003eTexas Rangers\u003c/strong\u003e hovered around .500, sparking debate about whether they would buy or sell, with Jacob deGrom and Corey Seager mentioned as potential movers.\u003c/li\u003e\n\u003cli\u003eThe \u003cstrong\u003eCincinnati Reds\u003c/strong\u003e were reportedly fielding calls for star shortstop Elly De La Cruz, with the Red Sox showing interest.\u003c/li\u003e\n\u003cli\u003eThe \u003cstrong\u003eSeattle Mariners\u003c/strong\u003e, experiencing a disappointing season, explored options including trading impending free agent Arozarena, and potentially pitchers George Kirby and Logan Hancock from their strong rotation.\u003c/li\u003e\n\u003cli\u003eThe Red Sox were reportedly willing to trade outfielder Jarren Duran.\u003c/li\u003e\n\u003cli\u003eThe Tigers scratched Casey Mize from a start, signaling he was a likely trade candidate.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThe social media landscape buzzed with activity, reflecting a largely positive sentiment around the deadline's excitement, though some debates naturally arose regarding specific team strategies and player valuations. This 2026 MLB trade deadline will undoubtedly be remembered for its key moves and the strategic shifts that could define the remainder of the season.\u003c/p\u003e\n","title":"2026 MLB Trade Deadline Frenzy: Dodgers Land Skubal, Phillies Go Big, and More Major Moves","authors":[{"username":"@elenvox","name":"Elen Vox"}],"date":"2026-08-03T14:31:53Z","summary":"The 2026 MLB trade deadline brought a whirlwind of activity, with teams making strategic moves to reshape their rosters. From the Dodgers' acquisition of two-time AL Cy Young winner Tarik Skubal to the Phillies' aggressive pursuit of top talent, here's a recap of the biggest deals and rumors that captivated the baseball world.","tags":["MLB","Trade Deadline","Baseball","Tarik Skubal","Los Angeles Dodgers","Philadelphia Phillies","Luis Arraez","Toronto Blue Jays","Jose Soriano","Sports News 2026"],"sources":[{"url":"https://sports.yahoo.com/articles/mlb-trade-deadline-tracker-live-100001882.html","title":"MLB trade deadline tracker: Live rumors, news, updates before 2026 deadline"},{"url":"https://www.msn.com/en-us/sports/mlb/mlb-trade-deadline-updates-rumors-news-and-latest-hot-stove-intel/ar-AA29bTog?ocid=BingNewsVerp","title":"MLB trade deadline updates: Rumors, news and latest hot stove intel"},{"url":"https://www.msn.com/en-us/sports/mlb/mlb-trade-deadline-tracker-live-rumors-news-updates-before-2026-deadline/ar-AA29eni4?ocid=BingNewsVerp","title":"MLB trade deadline tracker: Live rumors, news, updates before 2026 deadline"},{"url":"https://www.msn.com/en-us/sports/baseball/what-time-is-the-mlb-trade-deadline-today-latest-news-rumors-top-targets-to-know-for-2026/ar-AA29hN1w?ocid=BingNewsVerp","title":"What time is the MLB trade deadline today? Latest news, rumors \u0026 top targets to know for 2026"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"2026-mlb-trade-deadline-frenzy-dodgers-land-skubal"},"buildId":"mdzc-8the_Msag-5tFbW-","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
