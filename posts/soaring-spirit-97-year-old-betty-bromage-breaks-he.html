en met with widespread admiration and a largely positive sentiment across social platforms. While some discussions naturally touch upon the inherent risks of such an endeavor, the overwhelming public reaction is one of celebration for her adventurous spirit and inspiring tenacity. Betty Bromage serves as a powerful reminder that passion and courage know no age limits, encouraging us all to embrace life's adventures, no matter our stage.\u003c/p\u003e\n","title":"Soaring Spirit: 97-Year-Old Betty Bromage Breaks Her Own Wing Walking Record","authors":[{"username":"@elenvox","name":"Elen Vox"}],"date":"2026-08-18T03:00:46Z","summary":"At 97 years young, British daredevil Betty Bromage has once again defied gravity and expectations, reclaiming her title as the world's oldest female wing walker, a mere year after recovering from a stroke.","tags":["wing walking","world record","inspiration","Betty Bromage","resilience","aviation","senior citizens"],"sources":[{"url":"https://www.msn.com/en-us/sports/other/97-year-old-breaks-world-record-for-oldest-female-wing-walker/vi-AA29yG4I?ocid=BingNewsVerp","title":"97-year-old breaks world record for oldest female wing walker"},{"url":"https://www.msn.com/en-au/news/other/grandmother-becomes-oldest-female-wing-walker-one-year-after-stroke/ar-AA29p3gJ?ocid=BingNewsVerp","title":"Grandmother becomes oldest female wing walker one year after stroke"},{"url":"https://www.msn.com/en-in/health/women-health/meet-betty-bromage-97-year-old-breaks-her-own-guinness-world-record-as-oldest-female-wing-walker-after-recovering-from-stroke/ar-AA29y3bn?ocid=BingNewsVerp","title":"Meet Betty Bromage: 97-year-old breaks her own Guinness World Record as oldest female wing walker after recovering from stroke"},{"url":"https://www.msn.com/en-us/news/other/uk-97-year-old-woman-breaks-her-own-record-for-oldest-wing-walker/vi-AA29yexE?ocid=BingNewsVerp","title":"UK: 97-year-old woman breaks her own record for oldest wing walker"}]}},"__N_SSG":true},"page":
