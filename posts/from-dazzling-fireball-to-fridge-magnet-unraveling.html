<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-e000f3c4926d5b9b.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-9d8f6c641f7ffc28.js" defer=""></script><script src="/_next/static/g3SR_BwsrdcBYjv-LrGUH/_buildManifest.js" defer=""></script><script src="/_next/static/g3SR_BwsrdcBYjv-LrGUH/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"from-dazzling-fireball-to-fridge-magnet-unraveling","contentHtml":"\u003cp\u003eLast month, a brilliant fireball streaked across New Zealand's North Island, captivating onlookers and culminating in a 'huge boom' that echoed through the night. This dazzling celestial display wasn't just a fleeting spectacle; it heralded the arrival of New Zealand's 11th confirmed meteorite, thanks to the dedicated efforts of citizen scientists.\u003c/p\u003e\n\u003cp\u003eAt the heart of this cosmic detective story is Steve Wyn-Harris, a citizen astronomer and director of Fireballs Aotearoa. Days after the dramatic event, while scouting farmland, Wyn-Harris spotted a small, black stone. Initially skeptical – as many 'finds' turn out to be 'meteor-wrongs' – his doubts vanished with a simple, yet ingenious test: a fridge magnet. The tell-tale click, indicating the presence of iron and nickel common in meteorites, sparked cheers among fellow scientists on a video call, confirming an 8-gram piece of space rock.\u003c/p\u003e\n\u003cp\u003eFireballs Aotearoa, an alliance of astronomers, geologists, and citizen scientists, played a pivotal role in guiding this discovery. Their network of 200 cameras across the country meticulously tracked the meteor's trajectory. By crunching data on wind speed and flight path projections, the group precisely calculated a 'strewn field' – the area where meteorite fragments were likely to have landed. To prevent a frenzied 'meteor rush' and ensure scientific integrity (New Zealand law prohibits meteorite sales), the exact location was kept confidential.\u003c/p\u003e\n\u003cp\u003eWyn-Harris's initial discovery paved the way for more finds. Two days later, geology PhD student Liam McGovern and a team uncovered a second fragment weighing 39 grams. Over a period of ten days, the search party ultimately recovered four pieces, totaling 75 grams, with one even making an unannounced landing on a house's driveway.\u003c/p\u003e\n\u003cp\u003eScientists classify this new arrival as an 'ordinary chondrite,' believed to have originated from the distant asteroid belt. Dr. Marshall Palmer, a geologist with Fireballs Aotearoa, will now undertake further analysis and officially name these celestial visitors. Intriguingly, Professor James Scott, the founder of Fireballs Aotearoa, suggests these fragments may share a common origin with New Zealand's very first meteorite, discovered in 1863, hinting at a shared history from a catastrophically destroyed asteroid near the dawn of our solar system.\u003c/p\u003e\n\u003cp\u003eThe public's reaction to the meteor sighting and subsequent discovery has been overwhelmingly positive, marked by widespread delight and curiosity. New Zealand authorities also encouraged residents to remain vigilant and report any unusual black stones they might encounter, turning everyday citizens into potential cosmic treasure hunters.\u003c/p\u003e\n","title":"From Dazzling Fireball to Fridge Magnet: Unraveling New Zealand's Newest Meteorite Mystery","authors":[{"username":"@sarahjones","name":"Sarah Jones"}],"date":"2026-08-11T05:07:40Z","summary":"New Zealand skies recently witnessed a spectacular meteor shower, leading to the exciting discovery of the country's 11th confirmed meteorite. This extraordinary find, spearheaded by citizen scientists and a network of cameras, showcases the power of community and scientific collaboration in uncovering celestial treasures from beyond.","tags":["New Zealand","Meteorite","Fireball","Astronomy","Citizen Science","Space","Discovery","Fireballs Aotearoa"],"sources":[{"url":"https://www.theguardian.com/world/2026/aug/11/meteorite-hunters-metor-fragments-new-zealand","title":"Flight paths and fridge magnets: how a fireball hunter tracked down New Zealand’s newest meteorite"},{"url":"https://www.aol.co.uk/articles/thought-plane-fire-rare-meteor-022841000.html","title":"‘Thought it was a plane on fire’: rare meteor sightings stir delight in New Zealand"},{"url":"https://www.yahoo.com/news/science/articles/zealand-asks-residents-watch-rare-133500448.html","title":"New Zealand asks residents to watch for rare space rocks after 2 fiery sky flashes"},{"url":"https://www.msn.com/en-nz/news/national/flashes-of-light-thunderous-booms-as-possible-fireball-crosses-north-island/ar-AA28US4z?ocid=BingNewsVerp","title":"Flashes of light, thunderous booms as possible fireball crosses North Island"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"from-dazzling-fireball-to-fridge-magnet-unraveling"},"buildId":"g3SR_BwsrdcBYjv-LrGUH","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
