<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-e000f3c4926d5b9b.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-9d8f6c641f7ffc28.js" defer=""></script><script src="/_next/static/PMvd16wYfIgvhgnmy68Dx/_buildManifest.js" defer=""></script><script src="/_next/static/PMvd16wYfIgvhgnmy68Dx/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"philippines-rebukes-chinas-bullying-tactics-in-sou","contentHtml":"\u003cp\u003eA diplomatic incident at the recent Seoul Defence Dialogue has brought the simmering tensions in the South China Sea back into sharp focus. Philippine Defence Secretary Gilberto C. Teodoro Jr. publicly shamed China after a private note from a Chinese military attaché was delivered to him mid-speech.\u003c/p\u003e\n\u003cp\u003eDuring his address, Secretary Teodoro paused to read the contents of the unsolicited note aloud to the international audience. The document, which China later confirmed to reflect its consistent position, challenged the legitimacy of the 2016 arbitration ruling by the Permanent Court of Arbitration, a decision that invalidated China's expansive claims in the South China Sea under its 'nine-dash line' and upheld the Philippines' sovereign rights.\u003c/p\u003e\n\u003cp\u003eIn a powerful rebuke, Secretary Teodoro lambasted China's methods as a display of \"coercion, aggression, and outright disrespect of any diplomatic nicety, basic decency and good manners.\" He declared his intention to keep the note as a \"souvenir to demonstrate Beijing's weakness in an international forum like this,\" underscoring Manila's unwavering commitment to international law and the 2016 UNCLOS ruling.\u003c/p\u003e\n\u003cp\u003eChina's Ministry of Foreign Affairs responded by accusing the Philippines of \"instigating trouble and undermining bilateral ties,\" reiterating Beijing's dismissal of the arbitration decision. This exchange highlights the irreconcilable divides and persistent territorial disputes that continue to strain Philippines-China relations.\u003c/p\u003e\n\u003cp\u003eThis incident at the Seoul Defence Dialogue not only showcased the Philippines' firm resolve in defending its sovereign territory but also garnered significant attention, with simulated social sentiment largely positive towards Teodoro's decisive stand, albeit with some ongoing debate.\u003c/p\u003e\n","title":"Philippines Rebukes China's 'Bullying Tactics' in South China Sea Dispute","authors":[{"username":"@miguelreyes","name":"Miguel Reyes"}],"date":"2026-09-11T11:00:25Z","summary":"Philippine Defence Secretary Gilberto C. Teodoro publicly denounced China's actions during the Seoul Defence Dialogue, reading a private note from Beijing mid-speech that challenged the 2016 South China Sea arbitration ruling. Teodoro condemned the move as 'coercion, aggression, and outright disrespect,' asserting the Philippines' firm stance on international law.","tags":["Philippines","China","South China Sea","Diplomacy","International Law","Geopolitics","Seoul Defence Dialogue"],"sources":[{"url":"https://www.msn.com/en-us/news/other/philippines-defense-minister-reads-private-note-from-china-to-live-audience/ar-AA2bY6FA","title":"Philippines defense minister reads private note from China to live audience"},{"url":"https://www.msn.com/en-us/politics/government/philippine-defense-chief-torches-china-after-beijing-sends-him-note-mid-speech-you-lost/ar-AA2bOVQ1?ocid=BingNewsVerp","title":"Philippine defense chief torches China after Beijing sends him note mid-speech: 'You lost'"},{"url":"https://news24online.com/world/philippines-china-tensions-defence-chief-gilberto-teodoro-reads-beijings-note-mid-speech-in-seoul-asks-how-do-you-deal-with-this-behaviour/920367/","title":"Philippines-China tensions: Defence chief Gilberto Teodoro reads Beijing’s note mid-speech in Seoul, asks ‘How do you deal with this behaviour?’"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"philippines-rebukes-chinas-bullying-tactics-in-sou"},"buildId":"PMvd16wYfIgvhgnmy68Dx","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
