<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-e000f3c4926d5b9b.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-9d8f6c641f7ffc28.js" defer=""></script><script src="/_next/static/oGUVjMsMuh29qyjo-RH6A/_buildManifest.js" defer=""></script><script src="/_next/static/oGUVjMsMuh29qyjo-RH6A/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"south-africa-dominates-new-zealand-in-greatest-riv","contentHtml":"\u003cp\u003eThe Springboks have once again asserted their dominance on the international rugby stage, triumphing over their perennial rivals, the All Blacks of New Zealand, in a thrilling 'Greatest Rivalry' series. South Africa clinched the series 3-1, with a powerful 43-28 victory in the final test match held in Baltimore, USA.\u003c/p\u003e\n\u003cp\u003eThis particular encounter was more than just a series decider; it was a landmark event for rugby in North America. A staggering 68,173 fans flocked to M\u0026#x26;T Bank Stadium, setting a new record for a rugby international on US soil. This impressive turnout is being hailed as a crucial 'appetizer' for the sport's expansion in the United States, especially with the country slated to host the men's Rugby World Cup in 2031 and the women's tournament in 2033.\u003c/p\u003e\n\u003cp\u003eBoth team captains expressed optimism about rugby's future in the US. All Blacks captain Codie Taylor and his Springboks counterpart, Siya Kolisi, emphasized the importance of giving Americans more opportunities to experience the sport. Kolisi even suggested a groundbreaking idea: potential involvement from NFL teams in rugby clubs to further elevate the game's profile and attract a broader audience.\u003c/p\u003e\n\u003cp\u003eThe series itself was a high-quality showcase of test rugby, highlighting the Springboks' formidable power, precision, and gold-standard defensive capabilities. The final test also marked a significant milestone for South African coach Rassie Erasmus, his 100th match in charge, with Kolisi crediting him as a pivotal force behind the team's sustained success. The fervent rivalry and exceptional play resonated strongly, with social media sentiment predominantly positive, reflecting the excitement and debate generated by these titans of rugby.\u003c/p\u003e\n\u003cp\u003eAs the dust settles on this captivating series, the focus now shifts to the burgeoning potential of rugby in the United States, fueled by the electrifying performance of two of the world's best teams.\u003c/p\u003e\n","title":"South Africa Dominates New Zealand in 'Greatest Rivalry' Series, Igniting US Rugby Hopes","authors":[{"username":"@sarahjones","name":"Sarah Jones"}],"date":"2026-09-14T09:33:12Z","summary":"South Africa's decisive 3-1 series victory over New Zealand in the 'Greatest Rivalry' series culminated in a historic match in Baltimore, drawing a record crowd and signaling a bright future for rugby in the United States.","tags":["Rugby","South Africa","New Zealand","Springboks","All Blacks","Greatest Rivalry","USA Rugby","Rugby World Cup","Sports"],"sources":[{"url":"https://www.msn.com/en-us/news/other/south-africa-crush-new-zealand-to-claim-greatest-rivalry-series/ar-AA2c6Vj3?ocid=BingNewsVerp","title":"South Africa crush New Zealand to claim greatest rivalry series"},{"url":"https://www.skysports.com/rugby-union/news/12040/13585288/south-africa-vs-new-zealand-record-crowd-in-baltimore-provides-appetiser-for-2031-rugby-world-cup-on-us-soil","title":"South Africa vs New Zealand: Record crowd in Baltimore provides 'appetiser' for 2031 Rugby World Cup on US soil"},{"url":"https://www.nytimes.com/athletic/7588351/2026/09/12/new-zealand-south-africa-rugby-baltimore-record-attendance/","title":"South Africa runs over New Zealand in front of North American record 68,173 in Baltimore rugby match"},{"url":"https://www.msn.com/en-ca/news/other/rugby-s-greatest-rivalry-results-as-springboks-secure-series/ar-AA29j53i?ocid=BingNewsVerp","title":"Rugby’s greatest rivalry results as Springboks secure series"},{"url":"https://www.msn.com/en-us/news/other/how-to-watch-rugbys-greatest-rivalry-tour-2026-official-broadcasters-tv-streaming-guide-for-south-africa-vs-new-zealand/ar-AA2bS6Aj?ocid=BingNewsVerp","title":"How to watch Rugby's Greatest Rivalry tour 2026: Official broadcasters, TV \u0026 streaming guide for South Africa vs New Zealand"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"south-africa-dominates-new-zealand-in-greatest-riv"},"buildId":"oGUVjMsMuh29qyjo-RH6A","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
