stressed that Sprague's health is the primary concern, and the team hopes for his swift return as he is a significant part of their strategy.\u003c/p\u003e\n\u003cp\u003eIn Sprague's stead, the Wolverines' offensive line saw a significant reshuffle. Blake Fraizer transitioned from left tackle to right tackle, Evan Link moved from left guard to left tackle, and Nathan Efobi stepped in to start at guard. Despite the lack of practice reps in this new configuration, Whittingham expressed satisfaction with the line's performance, a testament to the team's adaptability.\u003c/p\u003e\n\u003cp\u003eIn more positive injury news, running back Jordan Marshall, who has been nursing a lower-body injury, is anticipated to be available for the upcoming Top 25 showdown against Iowa. Whittingham confirmed, \"Jordan will be available, unless there's a setback during the course of the week. He came out of this game feeling much better than what he came out of last game, so there's progress there.\"\u003c/p\u003e\n\u003cp\u003eAs Michigan prepares for a critical clash with Iowa this Saturday at 3:30 pm ET, the dynamic shifts on the offensive line and the return of a key running back will undoubtedly be central to their strategy. Social media sentiment surrounding these injury updates has been largely positive, though some debate exists among fans about the implications for the Wolverines' season.\u003c/p\u003e\n","title":"Wolverines Face Offensive Line Uncertainty as Key Protector Andrew Sprague Battles Injury","authors":[{"username":"@elenvox","name":"Elen Vox"}],"date":"2026-09-22T07:30:26Z","summary":"Michigan offensive lineman Andrew Sprague's return timeline is uncertain, prompting a reshuffle of the Wolverines' line ahead of their Top 25 clash with Iowa. Meanwhile, running back Jordan Marshall is expected to be available despite a lower-body injury.","tags":["Michigan Football","Andrew Sprague","Jordan Marshall","Injury Update","Wolverines","NCAAF","Big Ten","College Football","Bryce Underwood"],"sources":[{"url":"https://sports.yahoo.com/articles/michigan-news-wolverines-key-injury-011328875.html","title":"Michigan news: Wolverines get key injury update on Bryce Underwood protector"},{"url":"https://www.msn.com/en-us/sports/college-sports/michigan-gets-key-injury-update-on-bryce-underwood-protector/ar-AA2cIlD0?ocid=BingNewsVerp","title":"Michigan gets key injury update on Bryce Underwood protector"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"wolverines-face-offensive-line-uncertainty-as-key-"},"buildId":"oGUVjMsMuh29qyjo-RH6A","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
