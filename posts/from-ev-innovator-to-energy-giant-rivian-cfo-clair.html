<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-e000f3c4926d5b9b.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-9d8f6c641f7ffc28.js" defer=""></script><script src="/_next/static/g3SR_BwsrdcBYjv-LrGUH/_buildManifest.js" defer=""></script><script src="/_next/static/g3SR_BwsrdcBYjv-LrGUH/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"from-ev-innovator-to-energy-giant-rivian-cfo-clair","contentHtml":"\u003cp\u003eIn a significant leadership change, Claire McDonough, Chief Financial Officer of electric vehicle manufacturer Rivian, is set to resign and join GE Vernova, an energy equipment company. Her departure from Rivian, effective October 30th, comes after a impactful nearly six-year tenure.\u003c/p\u003e\n\u003cp\u003eMcDonough played a pivotal role in Rivian's journey, notably guiding the company through its substantial $13.7 billion initial public offering (IPO) in 2021, one of the largest U.S. IPOs at the time. She was also instrumental in strategic initiatives, including the successful launch of the R2 SUV and a major technology joint venture with German automaker Volkswagen, which saw Volkswagen invest $5.8 billion into Rivian for access to its electrical architecture and software.\u003c/p\u003e\n\u003cp\u003eThe move to GE Vernova is driven by McDonough's desire to relocate to the U.S. East Coast to be closer to her family. Rivian has clarified that her resignation is not a result of any disagreements with management or the board. While her departure injects a measure of uncertainty, especially as Rivian ramps up production of its crucial R2 SUV, the company is actively searching for a permanent replacement. In the interim, Derek Mulvey, Rivian’s Vice President of Finance, will assume the CFO role.\u003c/p\u003e\n\u003cp\u003eThe announcement saw Rivian's stock experience a slight dip, reflecting investor concerns about leadership continuity during a critical growth phase. However, social sentiment surrounding McDonough's transition is generally positive, with some debate, likely focusing on the strategic implications for both Rivian's future and GE Vernova's direction in an energy sector increasingly shaped by AI innovations.\u003c/p\u003e\n\u003cp\u003eMcDonough's transition underscores the dynamic nature of top executive talent in today's evolving technology and energy sectors, highlighting the increasing crossover appeal of leaders with strong financial and strategic acumen.\u003c/p\u003e\n","title":"From EV Innovator to Energy Giant: Rivian CFO Claire McDonough Joins GE Vernova","authors":[{"username":"@alanaturner","name":"Alana Turner"}],"date":"2026-08-30T02:31:44Z","summary":"Rivian's accomplished CFO, Claire McDonough, is departing the electric vehicle pioneer to take on a similar role at GE Vernova, an energy equipment company. Her strategic move to the East Coast marks a significant shift in the tech and energy landscapes, with implications for both companies as the energy sector increasingly intertwines with AI advancements.","tags":["Rivian","GE Vernova","Claire McDonough","CFO","Electric Vehicles","Energy Sector","AI","Leadership Change","Business News"],"sources":[{"url":"https://americanbazaaronline.com/2026/08/28/rivian-cfo-claire-mcdonough-to-resign-and-join-ge-vernova-487179/","title":"Rivian CFO Claire McDonough to resign and join GE Vernova"},{"url":"https://247wallst.com/investing/2026/08/28/rivian-falls-6-as-cfo-departs-for-ge-vernova-lucid-slipps-tesla-holds-steady/","title":"Rivian Falls 6% as CFO Departs for GE Vernova; Lucid Slips, Tesla Holds Steady"},{"url":"https://www.msn.com/en-ca/news/other/rivian-s-finance-chief-mcdonough-steps-down-joins-ge-vernova/ar-AA2b4VU0","title":"Rivian's finance chief McDonough steps down, joins GE Vernova"},{"url":"https://finance.yahoo.com/energy/articles/general-electric-ge-names-claire-042301638.html","title":"General Electric (GE) Names Claire McDonough As GE Vernova CFO"},{"url":"https://www.ttnews.com/articles/rivian-cfo-claire-mcdonough","title":"Rivian CFO Claire McDonough moves to GE Vernova"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"from-ev-innovator-to-energy-giant-rivian-cfo-clair"},"buildId":"g3SR_BwsrdcBYjv-LrGUH","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
