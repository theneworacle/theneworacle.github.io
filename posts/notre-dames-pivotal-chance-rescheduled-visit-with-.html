<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-e000f3c4926d5b9b.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-9d8f6c641f7ffc28.js" defer=""></script><script src="/_next/static/cqH2wsk4pgarRe2mifYn9/_buildManifest.js" defer=""></script><script src="/_next/static/cqH2wsk4pgarRe2mifYn9/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"notre-dames-pivotal-chance-rescheduled-visit-with-","contentHtml":"\u003cp\u003eThe recruiting landscape in college football is a constant flurry of activity, and for Notre Dame, all eyes are now on Xander Edwards. The highly-touted four-star running back from the 2028 class has emerged as a top target for the Fighting Irish, and a recent development in his recruitment could significantly alter his path to college.\u003c/p\u003e\n\u003cp\u003eEdwards, whose father, Marc Edwards, was a standout fullback for Notre Dame in the 1990s, was initially expected to visit South Bend for the Michigan State game. However, that visit has been rescheduled. Instead, Edwards will now make his official trip on November 7th, coinciding with Notre Dame's matchup against the Miami Hurricanes. This shift is more than just a date change; it's a pivotal moment for Marcus Freeman's coaching staff.\u003c/p\u003e\n\u003cp\u003eInitially, Notre Dame was perceived as not prioritizing Edwards as heavily as some other programs. Yet, over the last few months, the coaching staff, particularly running back coach Ja'Juan Seider, has significantly intensified their recruitment efforts. This renewed push comes at a critical juncture, as Miami had previously been considered a front-runner in Edwards' recruitment. The opportunity to impress him in a head-to-head scenario against a perceived rival offers Notre Dame a unique chance to assert themselves and potentially sway his decision.\u003c/p\u003e\n\u003cp\u003eEdwards' resume speaks for itself. He is ranked as the No. 113 overall player, the No. 7 running back, and the No. 15 player from Florida in the 2028 class. His talent is undeniable, evident in a stellar sophomore season where he rushed for over 2,600 yards and an astonishing 44 touchdowns. He continues to perform at a high level in his junior year. With nearly 40 offers from top programs including Florida, Ohio State, and Indiana, his recruitment is one of the most competitive in the nation.\u003c/p\u003e\n\u003cp\u003eSocial media sentiment regarding Edwards' recruitment is largely positive, with ongoing discussions among fans highlighting the excitement and debate surrounding his future. The upcoming visit against Miami is not just another game; it's a massive chance for Notre Dame to leverage their home-field advantage, the atmosphere, and their performance against a key competitor to make a lasting impression on a player who could be a cornerstone of their 2028 class. The next few weeks will be crucial as the Fighting Irish aim to ascend to the top of Edwards' recruitment list.\u003c/p\u003e\n","title":"Notre Dame's Pivotal Chance: Rescheduled Visit with Elite 2028 RB Xander Edwards Could Reshape Recruitment","authors":[{"username":"@elenvox","name":"Elen Vox"}],"date":"2026-09-16T07:26:41Z","summary":"Elite 2028 running back Xander Edwards, a top Notre Dame target and son of a former Fighting Irish star, has rescheduled his crucial visit to South Bend for the Miami game, presenting a golden opportunity for Notre Dame to make up for lost time and gain an edge in his highly contested recruitment.","tags":["Notre Dame Football","College Football Recruiting","Xander Edwards","2028 Recruiting Class","Marcus Freeman","Miami Hurricanes"],"sources":[{"url":"https://sports.yahoo.com/articles/top-notre-dame-target-not-181702510.html","title":"Top Notre Dame target will not be visiting for Michigan State, but the news offers a unique chance to upend the assumed leader"},{"url":"https://www.msn.com/en-us/sports/other/notre-dame-s-2028-recruiting-class-early-offensive-wish-list-features-sons-of-former-nfl-stars-elite-size-on-the-line/ar-AA26Unge?ocid=BingNewsVerp","title":"Notre Dame's 2028 recruiting class early offensive wish list features sons of former NFL stars, elite size on the line"},{"url":"https://www.msn.com/en-us/sports/other/notre-dame-football-s-2028-offensive-recruiting-board-features-sons-of-former-nfl-stars-and-an-elite-ol-target/ar-AA27UC2x?ocid=BingNewsVerp","title":"Notre Dame football's 2028 offensive recruiting board features sons of former NFL stars and an elite OL target"},{"url":"https://www.msn.com/en-us/sports/college-sports/notre-dame-football-2028-recruiting-early-running-back-targets-to-know-for-marcus-freeman-and-the-fighting-irish-staff/ar-AA290Dpw?ocid=BingNewsVerp","title":"Notre Dame football 2028 recruiting: Early running back targets to know for Marcus Freeman and the Fighting Irish staff"},{"url":"https://sports.yahoo.com/articles/notre-dame-football-holds-edge-152420954.html","title":"Notre Dame football holds the edge for yet another top-100 recruiting target over an elite group of suitors"},{"url":"https://sports.yahoo.com/articles/notre-dames-2028-recruiting-class-201350080.html","title":"Notre Dame's 2028 recruiting class early offensive wish list features sons of former NFL stars, elite size on the line"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"notre-dames-pivotal-chance-rescheduled-visit-with-"},"buildId":"cqH2wsk4pgarRe2mifYn9","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
