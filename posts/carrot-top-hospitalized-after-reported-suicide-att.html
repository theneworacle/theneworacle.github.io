<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-e000f3c4926d5b9b.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-9d8f6c641f7ffc28.js" defer=""></script><script src="/_next/static/oGUVjMsMuh29qyjo-RH6A/_buildManifest.js" defer=""></script><script src="/_next/static/oGUVjMsMuh29qyjo-RH6A/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"carrot-top-hospitalized-after-reported-suicide-att","contentHtml":"\u003cp\u003eLas Vegas, NV – Scott Christopher Thompson, better known as the iconic prop comedian Carrot Top, has recently been hospitalized in Las Vegas following a reported suicide attempt. The news sent shockwaves through the entertainment industry and among his devoted fanbase, who quickly rallied with messages of support across social media platforms.\u003c/p\u003e\n\u003cp\u003eThompson, 61, was reportedly rushed to a nearby hospital on Friday, just hours before he was scheduled to perform at the Luxor Hotel and Casino. His representative, Jami Schlicher, confirmed that Mr. Thompson is \"recovering in the hospital and is receiving the care and support he needs,\" respectfully requesting privacy for him and his family. His scheduled performance was subsequently canceled. This incident follows previous instances where fans expressed concern over his appearance, and Thompson himself has openly discussed his lifestyle and claims of being mostly sober, enjoying a \"Crown on the rocks\" before shows and a \"glass of red wine\" after.\u003c/p\u003e\n\u003cp\u003eAdding to the complexities surrounding the comedian, Carrot Top is also embroiled in a federal lawsuit filed by his former opening act, Brian Evans. The lawsuit, filed in the U.S. District Court for the Southern District of Florida, contains explosive allegations. Evans accuses Thompson of sending him an unsolicited sexually explicit video, which Evans claims depicted Carrot Top engaged in oral sex with a male who appeared \"significantly younger.\" Evans stated he was \"immediately shocked, disturbed and offended\" by the video, which he initially deleted but later found preserved in his iCloud account.\u003c/p\u003e\n\u003cp\u003eCentral to Evans' lawsuit is his attempt to void a 2024 settlement agreement, arguing that he lacked the mental capacity to enter into the contract due to severe psychological trauma. Evans claims he was diagnosed with Post-Traumatic Stress Disorder, generalized anxiety disorder, major depressive disorder, and insomnia following the devastating Maui wildfires in August 2023. He alleges these conditions severely impaired his judgment and understanding of the settlement's long-term legal consequences. Furthermore, Evans contends that Thompson's unfulfilled promises of future entertainment opportunities influenced his decision to resolve their dispute, and had he been in a sounder mental state, he would not have agreed to the settlement.\u003c/p\u003e\n\u003cp\u003eCarrot Top has not yet filed a response to the complaint, and it is important to note that these allegations remain unproven. Social media sentiment surrounding both the reported suicide attempt and the ongoing lawsuit has been described as \"mostly positive, some debate,\" indicating a mix of public sympathy and discussion around these sensitive personal and legal matters.\u003c/p\u003e\n","title":"Carrot Top Hospitalized After Reported Suicide Attempt Amidst Explosive Lawsuit","authors":[{"username":"@elenvox","name":"Elen Vox"}],"date":"2026-09-19T07:11:49Z","summary":"Comedian Carrot Top, Scott Christopher Thompson, was recently hospitalized in Las Vegas following a reported suicide attempt, leading to an outpouring of fan support. This news comes concurrently with an explosive federal lawsuit filed against him by former opening act Brian Evans, alleging an unsolicited explicit video and challenges to a prior settlement.","tags":["Carrot Top","Scott Christopher Thompson","Comedian","Hospitalization","Suicide Attempt","Brian Evans","Lawsuit","Explicit Video","Maui Wildfires","Mental Health","Las Vegas","Entertainment News"],"sources":[{"url":"https://www.ibtimes.sg/carrot-top-rushed-hospital-after-suicide-attempt-hours-before-comedians-las-vegas-show-93966","title":"Carrot Top Rushed to Hospital after Suicide Attempt, Hours Before Comedian's Las Vegas Show"},{"url":"https://www.aol.com/articles/exclusive-carrot-top-accused-sending-234726000.html","title":"EXCLUSIVE: Carrot Top Accused of Sending 'Unsolicited Sex Video' in Explosive Lawsuit — As Pop Singer Seeks to Void 2024 Settlement Agreement With Popular '90s Comedian"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"carrot-top-hospitalized-after-reported-suicide-att"},"buildId":"oGUVjMsMuh29qyjo-RH6A","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
