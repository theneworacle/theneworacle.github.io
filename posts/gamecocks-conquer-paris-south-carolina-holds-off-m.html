<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-7bc367af1df2b57e.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-609eda5bf9fae427.js" defer=""></script><script src="/_next/static/i95nDAtYRXGmk9zT6JOie/_buildManifest.js" defer=""></script><script src="/_next/static/i95nDAtYRXGmk9zT6JOie/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"gamecocks-conquer-paris-south-carolina-holds-off-m","contentHtml":"\u003cp\u003eThe much-anticipated women's college basketball season kicked off with a bang in Paris, France, as the top-ranked South Carolina Gamecocks faced off against the No. 20 Maryland Terrapins. In a game that delivered both early dominance and a thrilling comeback attempt, South Carolina ultimately prevailed with a 101-93 victory.\u003c/p\u003e\n\u003cp\u003eFrom the opening whistle, South Carolina asserted their authority, quickly building a substantial lead. Their offensive prowess was on full display, racking up 27 fast-break points and capitalizing on 21 points off turnovers in the first half alone. Joyce Edwards led the charge for the Gamecocks, finishing with an impressive 23 points, demonstrating why her team holds the top spot.\u003c/p\u003e\n\u003cp\u003eHowever, the Terrapins were not to be outdone. After trailing significantly at halftime, Maryland unleashed a furious second-half rally, spearheaded by an unforgettable performance from Addi Mack. Mack exploded for a career-high 35 points, with an astounding 31 of those coming in the second half, bringing Maryland within striking distance and forcing a crucial timeout from South Carolina coach Dawn Staley.\u003c/p\u003e\n\u003cp\u003eThe Gamecocks, showing championship mettle, regrouped after the timeout and managed to fend off Maryland's relentless pursuit, securing the hard-fought win. The international setting also offered a special moment for South Carolina's French players, Alicia Tournabize and Justine Loubens, who had the unique opportunity to play their season opener in their home country.\u003c/p\u003e\n\u003cp\u003eThe game was a spectacle of high-scoring basketball, dominant runs, and remarkable individual performances, leaving fans eager for what the rest of the season holds for both teams. Social media sentiment largely reflected the excitement, with many praising the dramatic swings and the competitive spirit displayed.\u003c/p\u003e\n","title":"Gamecocks Conquer Paris: South Carolina Holds Off Maryland in Thrilling Season Opener","authors":[{"username":"@elenvox","name":"Elen Vox"}],"date":"2026-11-03T09:12:42Z","summary":"Top-ranked South Carolina opened their season with a dominant first half against No. 20 Maryland in Paris, ultimately securing a 101-93 victory despite a fierce second-half comeback led by Maryland's Addi Mack. Joyce Edwards shone for the Gamecocks, while two French players celebrated a homecoming.","tags":["South Carolina Gamecocks","Maryland Terrapins","Women's College Basketball","NCAA","Joyce Edwards","Addi Mack","Paris","Season Opener","Basketball"],"sources":[{"url":"https://foxbaltimore.com/sports/sports-unlimited/top-ranked-south-carolina-holds-off-no-20-maryland-in-season-opener-in-paris","title":"Top-ranked South Carolina holds off No. 20 Maryland in season opener in Paris"},{"url":"https://www.thestate.com/sports/college/university-of-south-carolina/usc-womens-basketball/article317849278.html","title":"No. 1 South Carolina holds off Maryland rally to win opener in Paris. What we learned"},{"url":"https://www.msn.com/en-us/sports/basketball/south-carolina-s-paris-win-delivered-a-statement-then-a-warning/ar-AA2gBOBb?ocid=BingNewsVerp","title":"South Carolina’s Paris win delivered a statement, then a warning"},{"url":"https://www.msn.com/en-us/news/other/south-carolina-vs-maryland-in-paris-score-live-updates-tv-highlights/ar-AA2gA6GP?ocid=BingNewsVerp","title":"South Carolina vs Maryland in Paris score, live updates, TV, highlights"},{"url":"https://www.msn.com/en-us/sports/basketball/no-1-south-carolina-opens-season-with-101-93-win-over-no-20-maryland-in-paris-addi-mack-scores-35-for-terrapins/ar-AA2gBoAe?ocid=BingNewsVerp","title":"No. 1 South Carolina opens season with 101-93 win over No. 20 Maryland in Paris; Addi Mack scores 35 for Terrapins"},{"url":"https://www.msn.com/en-us/sports/college-sports/south-carolina-women-s-basketball-opens-season-in-paris-as-fans-weigh-travel-amid-european-protests/ar-AA2giJ5O?ocid=BingNewsVerp","title":"South Carolina women’s basketball opens season in Paris as fans weigh travel amid European protests"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"gamecocks-conquer-paris-south-carolina-holds-off-m"},"buildId":"i95nDAtYRXGmk9zT6JOie","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
