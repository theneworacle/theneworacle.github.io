<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-e000f3c4926d5b9b.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-9d8f6c641f7ffc28.js" defer=""></script><script src="/_next/static/oGUVjMsMuh29qyjo-RH6A/_buildManifest.js" defer=""></script><script src="/_next/static/oGUVjMsMuh29qyjo-RH6A/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"new-zealand-inquiry-slams-officials-over-tom-phill","contentHtml":"\u003cp\u003eThe shocking case of Tom Phillips, who absconded with his three young children into the dense New Zealand forest for nearly four years, has culminated in a damning public inquiry report. Released recently, the report severely criticizes the actions – or inactions – of police and the child protection agency, Oranga Tamariki, highlighting a series of profound failures that endangered the children's welfare.\u003c/p\u003e\n\u003cp\u003eTom Phillips vanished with his children, then aged 5, 7, and 8, from the tiny rural township of Marokopa in December 2021. This was not his first disappearance with them. The inquiry found that for \"significant periods,\" officials \"underplayed, minimised or overlooked\" the severe harms and risks the children faced while living in rugged, squalid conditions without access to healthcare or education. Disturbingly, concerns raised by the children's mother and other relatives were often dismissed as merely part of a \"parenting dispute.\"\u003c/p\u003e\n\u003cp\u003eThe report details numerous missed opportunities. Police officers and social workers failed to act with sufficient urgency following the family's initial disappearance months prior to the December 2021 incident. Furthermore, the inquiry noted that officials did not respond quickly enough to a 2023 sighting of the family and failed to seek surveillance warrants or involve the military early on.\u003c/p\u003e\n\u003cp\u003eNew Zealand Minister of Social Development Louise Upston issued a heartfelt apology, stating, \"To the Phillips children directly, this report has found that our agencies did not take all practical steps to protect you. For that we are deeply sorry.\" The government has pledged to implement all of the report's recommendations, which include significant changes to how child welfare concerns are reported and handled. However, the public inquiry does not have the power to name individual officials for criminal charges or impose penalties.\u003c/p\u003e\n\u003cp\u003eAmanda Malu, Chief Executive of Oranga Tamariki, acknowledged the agency's shortcomings, finding the report \"difficult and at times harrowing\" to read. She specifically recognized the courage of the children’s mother and older siblings, admitting, \"We did not listen in the way we should have, and this family deserved better from us.\"\u003c/p\u003e\n\u003cp\u003eThe tragic saga concluded in September 2025 when Tom Phillips was killed in a police shootout after committing armed robberies and seriously wounding a police officer. Shortly thereafter, his children were discovered along with a cache of guns at a makeshift campsite nearby. It was revealed that Phillips had committed armed robberies while on the run, and despite not having legal custody, Oranga Tamariki staff had, between his first and second disappearances, falsely assured a family court that the children were \"completely fine,\" deliberately omitting concerns raised by the mother and police.\u003c/p\u003e\n\u003cp\u003eSocial sentiment regarding the inquiry's findings has been largely positive, suggesting public approval of the accountability measures, though some debate lingers concerning broader systemic issues and the extent of the actions taken. The hope remains that the lessons learned from this harrowing case will lead to robust reforms, ensuring no other New Zealand children fall through the cracks of a failing protection system.\u003c/p\u003e\n","title":"New Zealand Inquiry Slams Officials Over Tom Phillips Child Abduction Case","authors":[{"username":"@sarahjones","name":"Sarah Jones"}],"date":"2026-09-19T08:31:59Z","summary":"A damning public inquiry in New Zealand has heavily criticized police and the child protection agency Oranga Tamariki for their severe failings in the case of Tom Phillips, who hid his three children in a remote forest for nearly four years. The report reveals how officials \"underplayed\" the risks and dismissed the mother's concerns, prompting a government apology and pledges for reform.","tags":["New Zealand","Tom Phillips","Child Abduction","Oranga Tamariki","Police Misconduct","Public Inquiry","Child Protection","Family Court","Missing Children","Government Apology","Social Services","Negligence"],"sources":[{"url":"https://www.mercurynews.com/2026/09/16/new-zealand-missing-family/","title":"Inquiry into New Zealand man, who hid his kids in forest for years, lambasts officials’ actions - The Mercury News"},{"url":"https://www.msn.com/en-us/news/other/inquiry-to-probe-case-of-father-who-hid-children-in-forest-for-years/ar-AA1RfGAR?ocid=BingNewsVerp","title":"Inquiry to probe case of father who hid children in forest for years - MSN"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"new-zealand-inquiry-slams-officials-over-tom-phill"},"buildId":"oGUVjMsMuh29qyjo-RH6A","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
