<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-e000f3c4926d5b9b.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-9d8f6c641f7ffc28.js" defer=""></script><script src="/_next/static/BFMJo_6-kRoES5zYcIafL/_buildManifest.js" defer=""></script><script src="/_next/static/BFMJo_6-kRoES5zYcIafL/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"dally-m-medal-2026-a-night-of-rugby-league-excelle","contentHtml":"\u003cp\u003eSydney was the focal point for the highly anticipated 2026 Dally M Medal Awards, a prestigious event held on the eve of the NRL and NRLW Grand Finals. The ceremony was set to be a dazzling recognition of outstanding talent and dedication in the world of rugby league, bringing together players, coaches, and fans to celebrate a remarkable season.\u003c/p\u003e\n\u003cp\u003eInjured Panthers skipper Nathan Cleary emerged as a strong favourite for the coveted NRL Dally M Medal, even as he recovered from a recent leg injury that required surgery. His exceptional performance throughout the season clearly left a lasting impression on voters. In the NRLW, Broncos superstar Tamika Upton was a leading contender, aiming to secure a consecutive Dally M Medal, a testament to her consistent brilliance on the field.\u003c/p\u003e\n\u003cp\u003eThe Dally M Awards encompass a wide array of categories, honouring excellence across various positions and roles. These would include positional awards such as Fullback, Wingers, Centres, Five-Eighth, Halfback, Hooker, Props, Backrowers, and Lock of the Year for both the NRL and NRLW competitions. Additionally, significant accolades like Coach of the Year, Captain of the Year, and Rookie of the Year were set to be presented, highlighting leadership, strategic prowess, and emerging talent.\u003c/p\u003e\n\u003cp\u003eBeyond individual and team recognitions, the ceremony was also set to celebrate other noteworthy achievements with awards like the Provan-Summons Medal, Ken Stephen Medal, Ken Irvine Medal, and Veronica White Medal. Excitement also built around the NRL and NRLW Try of the Year, Tackle of the Year, Top Point Scorer, and the Peter Frilingos Headline Moment of the Year, showcasing the most thrilling and impactful moments of the season.\u003c/p\u003e\n\u003cp\u003eSeveral players were noted for their strong performances in specific areas, including Josh Addo-Carr (Eels), Jamal Fogarty (Sea Eagles), Campbell Graham (Rabbitohs), James Tedesco (Roosters), Tom Jenkins (Panthers - 30 tries), Alex Johnston (Rabbitohs - 30 tries), Jamayne Isaako (Dolphins - 310 points), Jesse Southwell (Broncos - 114 points), and Jessica Sergis (Roosters - 17 tries).\u003c/p\u003e\n\u003cp\u003eSocial media sentiment surrounding the Dally M Medal 2026 was largely positive, reflecting the excitement and anticipation of fans. While some debates and differing opinions were observed, the overall atmosphere was one of celebration for the athletes and their incredible achievements. As the event unfolded, the complete list of confirmed winners for all categories was eagerly awaited, promising further insights into the standout performers of the year.\u003c/p\u003e\n","title":"Dally M Medal 2026: A Night of Rugby League Excellence and Anticipation","authors":[{"username":"@elenvox","name":"Elen Vox"}],"date":"2026-09-30T08:13:58Z","summary":"With the 2026 Dally M Medal Awards unfolding, Nathan Cleary and Tamika Upton stood out as strong contenders for top honors, setting the stage for a night of excitement as the rugby league community eagerly awaited the full list of winners.","tags":["Dally M Medal","NRL","NRLW","Rugby League","Sports Awards","Nathan Cleary","Tamika Upton"],"sources":[{"url":"https://www.sportingnews.com/au/rugby-league/news/dally-m-medal-2026-results-finalists-award-winners-team-year/4ebdf335fba2c3438061ff47","title":"Dally M Medal live updates: NRL and NRLW best players for 2026"},{"url":"https://www.zerotackle.com/2026-dally-m-medal-live-blog-every-award-as-it-happens-238573/","title":"2026 Dally M Medal live blog: Every award as it happens"},{"url":"https://www.nine.com.au/sport/nrl/dally-m-awards-live-updates-medal-winner-leaderboard-points-updates-news-20260930-p611ry.html","title":"Dally M Awards live updates: Multiple plans in play for Cleary to accept top honour"},{"url":"https://www.nrl.com/news/2026/08/04/medal-detector-can-tamika-break-curse-of-the-halfway-leader/","title":"Medal detector: Can Tamika break curse of the halfway leader"},{"url":"https://www.nrl.com/news/2026/09/30/dally-m-medal-2026-the-nrls-night-of-nights/","title":"Dally M Medal 2026: The NRL's night of nights"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"dally-m-medal-2026-a-night-of-rugby-league-excelle"},"buildId":"BFMJo_6-kRoES5zYcIafL","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
