d to $2.34 billion, exceeding analyst projections of $2.25 billion and showcasing a compelling 10.8% year-over-year growth.\u003c/p\u003e\n\u003cp\u003eThese strong results underscore News Corp's improved profitability, with a net margin of 6.35% and a return on equity reaching 7.09%. The combination of higher revenue and better-than-expected EPS suggests effective operational leverage, where incremental sales translate efficiently into bottom-line growth.\u003c/p\u003e\n\u003cp\u003eAnalyst sentiment surrounding NWSA remains largely positive, with an average price target of $36.16. This implies an attractive upside potential of 21.96% from the current trading price, indicating that the market anticipates further appreciation as the company continues to execute its strategic initiatives.\u003c/p\u003e\n\u003cp\u003eIn a move to reinforce its commitment to shareholder value, News Corp is actively engaging in its 2025 Repurchase Program, authorizing up to $1 billion in buybacks of its Class A and Class B common stock. The company has demonstrated its belief in the stock's intrinsic value by repurchasing shares at prices up to $35.29, higher than the current trading level, suggesting management views the equity as attractive for long-term growth.\u003c/p\u003e\n\u003cp\u003eThe core of News Corp's operational strength lies in its diversified portfolio of premium content and information services, particularly the highly successful Dow Jones professional-information suite. These subscription-based offerings provide financial news, market data, and business intelligence to a global client base, generating stable, recurring revenue that significantly contributes to the company's double-digit revenue growth and provides a foundation for continued investment in digital content and technology.\u003c/p\u003e\n\u003cp\u003eWith a generally positive social sentiment, News Corp appears well-positioned to sustain its momentum. The blend of robust financial performance, a constructive analyst outlook, and a proactive capital return strategy paints a promising picture for investors looking at the future of this resilient media and information giant.\u003c/p\u003e\n","title":"News Corp (NWSA) Shines: Strong Earnings and Bullish Outlook Drive Stock Resilience","authors":[{"username":"@alanaturner","name":"Alana Turner"}],"date":"2026-09-06T02:01:00Z","summary":"News Corp (NWSA) is capturing market attention with impressive fiscal Q4 2026 results, reporting significant earnings and revenue beats, robust profitability, and a positive analyst outlook. The media and information services giant demonstrates strong operational leverage and a commitment to shareholder returns.","tags":["News Corp","NWSA","Stock Market","Earnings Report","Financial Performance","Investor Relations","Media Industry","Dow Jones","Stock Analysis","Shareholder Value"],"sources":[{"url":"https://finance.yahoo.com/markets/stocks/articles/news-nwsa-stock-looks-above-161447501.html","title":"News (NWSA) Stock Looks Above Fair Value As Earnings Beat Lifts Shares"},{"url":"https://www.ad-hoc-news.de/boerse/news/corporate-news/resilient-news-corp-stock-holds-above-29-as-fresh-earnings-beat-lifts/69981047","title":"Resilient News Corp stock holds above $29 as fresh earnings beat lifts outlook"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"news-corp-nwsa-shines-strong-earnings-and-bullish-"},"buildId":"PMvd16wYfIgvhgnmy68Dx","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
