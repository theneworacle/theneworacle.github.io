<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-7bc367af1df2b57e.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-609eda5bf9fae427.js" defer=""></script><script src="/_next/static/i95nDAtYRXGmk9zT6JOie/_buildManifest.js" defer=""></script><script src="/_next/static/i95nDAtYRXGmk9zT6JOie/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"philippines-forges-ahead-with-us-backed-ai-hub-but","contentHtml":"\u003cp\u003eThe Philippines is set to become a major player in the global artificial intelligence landscape with the rapid development of a 4,000-acre AI and supply chain hub in New Clark City. This ambitious undertaking, part of the US-led Pax Silica initiative, is envisioned as a crucial step towards securing global AI and semiconductor supply chains.\u003c/p\u003e\n\u003cp\u003eUnder Secretary of State Jacob Helberg has highlighted the speed at which the US and Philippines are moving on the project, which aims to attract up to $70 billion in investments and create approximately 190,000 jobs. The hub will focus on AI computing infrastructure, semiconductor packaging, and the processing of critical minerals, positioning the Philippines to move up the semiconductor value chain.\u003c/p\u003e\n\u003cp\u003eDespite the promising outlook, the project is not without its challenges. Concerns have been raised by some US investors due to brewing local opposition. A significant point of contention involves the potential impact on the Aeta Hungey tribe, whose ancestral lands overlap with the designated 1,620 hectares for the AI data center parts hub. The tribe faces uncertainty regarding displacement and adequate compensation, with offers of 30 pesos per square meter being declined.\u003c/p\u003e\n\u003cp\u003eEnvironmental concerns, particularly regarding water and electricity demand in a country prone to droughts and power outages, have also surfaced. While the US State Department assures that rigorous environmental and community impact studies will inform the project's design, and investors will be required to build their own power and water systems, transparency remains a key issue for many stakeholders.\u003c/p\u003e\n\u003cp\u003eSocial media sentiment surrounding the Philippines AI hub is generally positive, indicating a hopeful public outlook, yet discussions and debates around the project's implications are ongoing. The success of the Pax Silica initiative in the Philippines will hinge on navigating these complex social, environmental, and economic factors while fostering sustained investment and a skilled workforce.\u003c/p\u003e\n","title":"Philippines Forges Ahead with US-Backed AI Hub, But Challenges Loom","authors":[{"username":"@miguelreyes","name":"Miguel Reyes"}],"date":"2026-11-04T14:08:16Z","summary":"The Philippines is rapidly developing a 4,000-acre AI and supply chain hub in New Clark City under the US-led Pax Silica initiative, aiming for up to $70 billion in investments and significant job creation. However, the ambitious project faces hurdles including concerns from US investors, local opposition, and the potential displacement of an indigenous tribe.","tags":["Philippines","AI Hub","Pax Silica","US Investment","Technology","Semiconductors","Economic Development","Indigenous Rights","Supply Chain"],"sources":[{"url":"https://thenextweb.com/news/us-philippines-pax-silica-ai-hub-clark-city","title":"The US is building a 4,000-acre AI hub in the Philippines, and the sovereignty questions are already piling up"},{"url":"https://www.bloomberg.com/news/articles/2026-09-21/ai-dissent-spooks-us-investors-in-philippine-hub-official-says","title":"AI Dissent Spooks US Investors in Philippine Hub, Official Says"},{"url":"https://gulfnews.com/world/asia/philippines/philippine-tribe-in-limbo-over-us-led-tech-hub-1.500681039","title":"Philippine tribe in limbo over US-led tech hub"},{"url":"https://www.msn.com/en-us/news/other/pax-silica-needs-a-follow-the-money-reality-check/ar-AA2fFSgr?ocid=BingNewsVerp","title":"Pax Silica Needs a “Follow the Money” Reality Check"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"philippines-forges-ahead-with-us-backed-ai-hub-but"},"buildId":"i95nDAtYRXGmk9zT6JOie","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
