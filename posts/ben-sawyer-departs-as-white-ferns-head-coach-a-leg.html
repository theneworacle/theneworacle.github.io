<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-e000f3c4926d5b9b.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-9d8f6c641f7ffc28.js" defer=""></script><script src="/_next/static/oGUVjMsMuh29qyjo-RH6A/_buildManifest.js" defer=""></script><script src="/_next/static/oGUVjMsMuh29qyjo-RH6A/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"ben-sawyer-departs-as-white-ferns-head-coach-a-leg","contentHtml":"\u003cp\u003eBen Sawyer, the highly successful head coach of the New Zealand women's cricket team, the WHITE FERNS, will be departing from his role after a commendable four-year tenure. New Zealand Cricket (NZC) confirmed that Sawyer's contract, which was slated to conclude in December 2026, would not be extended following a comprehensive review of the women's high-performance structure.\u003c/p\u003e\n\u003cp\u003eSawyer's leadership, which began in June 2022, ushered in a period of remarkable growth and achievement for the WHITE FERNS. His initial campaign saw the team secure a bronze medal at the 2022 Birmingham Commonwealth Games. The pinnacle of his coaching career with the WHITE FERNS arrived in 2024 when he guided them to New Zealand’s first-ever ICC Women’s T20 World Cup victory in Dubai. Under his guidance, several young talents, including Georgia Plimmer, Eden Carson, and Izzy Gaze, flourished and became World Cup winners.\u003c/p\u003e\n\u003cp\u003eReflecting on his time, Sawyer expressed profound gratitude and pride. \"Being the WHITE FERNS coach has been a huge honour and I’m really grateful to have had the opportunity to lead this group,\" he stated. \"This team means a lot to me and I’m really proud of what we’ve been able to achieve in the past four years.\"\u003c/p\u003e\n\u003cp\u003eNZC's Chief High Performance Cricket Officer Daryl Gibson acknowledged Sawyer's significant contribution, highlighting his commitment, professionalism, and the time invested in the women’s game. WHITE FERNS captain Melie Kerr also lauded Sawyer, stating, \"His preparation was second to none, he poured his heart and soul into the role and left no stone unturned trying to make the team better. Ben played a huge part in a defining moment for women’s cricket in New Zealand.\"\u003c/p\u003e\n\u003cp\u003eNZC indicated that the decision reflects a natural transition phase for the WHITE FERNS program, requiring a different leadership approach to support its future direction. The high-performance review also led to the introduction of a new Performance Lead role, resulting in the disestablishment of the WHITE FERNS Manager position. An interim head coach and team manager will oversee the upcoming T20I series against Australia, with recruitment for the permanent head coach and performance lead roles commencing shortly.\u003c/p\u003e\n\u003cp\u003eSawyer leaves a lasting legacy, having strengthened the team's structure and standards, leaving the WHITE FERNS in a stronger position than when he joined. His departure, while marking the end of an era, sets the stage for the next chapter in New Zealand women's cricket.\u003c/p\u003e\n","title":"Ben Sawyer Departs as WHITE FERNS Head Coach: A Legacy of Triumph and Transition","authors":[{"username":"@sarahjones","name":"Sarah Jones"}],"date":"2026-09-21T09:35:31Z","summary":"After a successful four-year tenure marked by a T20 World Cup victory and significant team development, Ben Sawyer will not have his contract renewed as the head coach of the New Zealand women's cricket team, the WHITE FERNS. This decision follows a comprehensive review by New Zealand Cricket as the team enters a new phase of leadership.","tags":["New Zealand Cricket","WHITE FERNS","Ben Sawyer","Cricket Coach","Women's Cricket","T20 World Cup","Sports News","NZC"],"sources":[{"url":"https://www.fanatik.com.tr/en/ben-sawyer-leaves-role-as-new-zealand-womens-cricket-head-coach-following-review-2638188","title":"Ben Sawyer Leaves Role as New Zealand Women's Cricket Head Coach Following Review"},{"url":"https://www.cricket.com.au/news/4578494/new-zealand-women-white-ferns-head-coach-ben-sawyer-departs-australia","title":"New Zealand part ways with coach Sawyer ahead of Aussie tour"},{"url":"https://www.reuters.com/sports/cricket/sawyer-leaves-role-new-zealand-womens-coach-2026-09-18/","title":"Sawyer leaves role as New Zealand women's coach"},{"url":"https://www.nzc.nz/ben-sawyer-departs-white-ferns/","title":"Ben Sawyer departs WHITE FERNS"},{"url":"https://newsable.asianetnews.com/sports/nz-cricket-parts-ways-with-t20-world-cup-winning-coach-ben-sawyer-articleshow-g2g8qkv","title":"NZ Cricket parts ways with T20 World Cup-winning coach Ben Sawyer"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"ben-sawyer-departs-as-white-ferns-head-coach-a-leg"},"buildId":"oGUVjMsMuh29qyjo-RH6A","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
