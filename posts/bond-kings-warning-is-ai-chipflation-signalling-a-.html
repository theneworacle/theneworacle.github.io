<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-e000f3c4926d5b9b.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-9d8f6c641f7ffc28.js" defer=""></script><script src="/_next/static/g3SR_BwsrdcBYjv-LrGUH/_buildManifest.js" defer=""></script><script src="/_next/static/g3SR_BwsrdcBYjv-LrGUH/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"bond-kings-warning-is-ai-chipflation-signalling-a-","contentHtml":"\u003cp\u003eBillionaire investor Jeff Gundlach, widely known as the 'Bond King,' is sounding the alarm on the current state of the market, suggesting that the recent trend of categorizing AI chips as a 'new asset class' could be a definitive signal of an impending market top. His cautionary stance comes amidst Nvidia's ambitious collaboration with six prominent asset managers – Apollo, BlackRock, Blackstone, Brookfield, Goldman Sachs, and KKR – to establish financing platforms aimed at mobilizing over $500 billion for AI infrastructure.\u003c/p\u003e\n\u003cp\u003eGundlach has voiced strong criticism regarding the prudence of this financial engineering. He questions the wisdom of using assets with an inherently uncertain and rapidly evolving lifespan, such as AI hardware, as collateral for long-term debt. To illustrate his point, Gundlach drew a pointed analogy, comparing the situation to issuing 30-year asset-backed securities against 'warehouses of bananas,' particularly 'newly engineered bananas of unknown life.' This vivid comparison highlights what he perceives as a critical 'duration mismatch' – long-term financial commitments being underpinned by short-term, quickly obsolete technology.\u003c/p\u003e\n\u003cp\u003eThe DoubleLine chief executive believes this pattern aligns with historical precedents observed near market peaks, often characterized by innovative financial products creating new asset classes, frequently bolstered by what he describes as 'questionable' credit ratings.\u003c/p\u003e\n\u003cp\u003eGundlach's concerns are not isolated. Other influential figures in the financial world share similar apprehensions. Mark Cuban, for instance, has drawn parallels between AI chips as an asset class and the volatile world of cryptocurrency, suggesting a potential bubble. Renowned investor Michael Burry, famous for predicting the 2008 housing market crash, has reportedly been shorting AI companies. His rationale? He believes today's cutting-edge processors will likely become obsolete long before the significant investments in them yield their expected returns.\u003c/p\u003e\n\u003cp\u003eMarket indicators also reflect a growing caution. Following Nvidia's announcement of $750 billion in AI deals, its credit default swaps hit a record high, signaling increased market concern about the company's financial health and the inherent risks. Furthermore, broader systemic warnings have emerged, with the Bank for International Settlements cautioning that a substantial downturn in the AI sector could trigger repercussions in credit markets on a scale comparable to the 2008 financial crisis.\u003c/p\u003e\n\u003cp\u003eWhile social media sentiment indicates a 'Mostly positive, some debate' reaction to Gundlach's statements, reflecting a general agreement with his concerns alongside ongoing discussions, the core question remains: Is a graphics processor still a viable asset to lend against in year seven, given the breakneck pace of technological advancement? Gundlach's warning serves as a critical reminder for investors to scrutinize the foundational economics behind the AI boom and to exercise caution in a market increasingly reliant on a rapidly evolving 'new asset class.'\u003c/p\u003e\n","title":"Bond King's Warning: Is 'AI Chipflation' Signalling a Market Top?","authors":[{"username":"@alanaturner","name":"Alana Turner"}],"date":"2026-08-18T00:45:42Z","summary":"Billionaire investor Jeff Gundlach, dubbed the 'Bond King', issues a stern warning that the emergence of AI chips as a 'new asset class' mirrors historical patterns of market tops. He critiques Nvidia's massive financing initiative, questioning the logic of collateralizing long-term debt with rapidly evolving, short-lifespan hardware.","tags":["AI","Investment","Market Top","Jeff Gundlach","Nvidia","Asset Class","Financial Engineering","Market Bubble","Technology Investment"],"sources":[{"url":"https://www.msn.com/en-us/money/savingandinvesting/billionaire-investor-jeff-gundlach-warns-of-a-market-top-as-ai-chips-become-a-new-asset-class/ar-AA2aiCs5","title":"Billionaire investor Jeff Gundlach warns of a market top as AI chips become a 'new asset class'"},{"url":"https://thenextweb.com/news/gundlach-nvidia-compute-asset-class-warning","title":"Jeff Gundlach says making AI chips an asset class looks like a market top"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"bond-kings-warning-is-ai-chipflation-signalling-a-"},"buildId":"g3SR_BwsrdcBYjv-LrGUH","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
