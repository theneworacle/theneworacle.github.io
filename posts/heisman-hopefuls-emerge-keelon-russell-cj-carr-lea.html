<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-e000f3c4926d5b9b.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-9d8f6c641f7ffc28.js" defer=""></script><script src="/_next/static/BFMJo_6-kRoES5zYcIafL/_buildManifest.js" defer=""></script><script src="/_next/static/BFMJo_6-kRoES5zYcIafL/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"heisman-hopefuls-emerge-keelon-russell-cj-carr-lea","contentHtml":"\u003cp\u003eThe race for the Heisman Trophy is heating up, and two new names have firmly planted themselves among the top contenders: Keelon Russell, quarterback for the Alabama Crimson Tide, and CJ Carr, quarterback for the Notre Dame Fighting Irish. Both signal-callers delivered standout performances in Week 5, earning them a coveted spot on the Sporting News' Heisman Watch list.\u003c/p\u003e\n\u003cp\u003eKeelon Russell's Heisman stock is soaring after a dominant display against Mississippi State. Russell was instrumental in Alabama's decisive 56-23 victory, throwing for three touchdowns and adding another on the ground. His season statistics underscore his impact, boasting a 71.2% completion rate, 1,414 passing yards, and 11 touchdowns through five games. College football analysts and fans alike have lauded Russell's poised and prolific play, with social media sentiment overwhelmingly positive, recognizing him as a legitimate threat for the prestigious award.\u003c/p\u003e\n\u003cp\u003eNot to be outdone, Notre Dame's CJ Carr also made a compelling case for Heisman consideration. Carr led his team to a victory over North Carolina, showcasing his arm talent with four touchdown passes. His season highlights include a 72.4% completion rate, 1,197 passing yards, and 13 touchdowns, complemented by three rushing touchdowns.\u003c/p\u003e\n\u003cp\u003eWhile Russell and Carr are ascending, the Heisman landscape is dynamic. Other key players currently in strong contention include Trinidad Chambliss (Ole Miss), Josh Hoover (Indiana), Darian Mensah (Miami), and explosive wide receiver Jeremiah Smith (Ohio State). Smith, in particular, has been making history with his receiving numbers, proving that a non-quarterback can still be a serious threat for the award.\u003c/p\u003e\n\u003cp\u003eConversely, some notable names have slipped into the 'fringe' category. Quarterbacks like Bear Bachmeier (BYU) and Texas' Arch Manning, along with running back Jadan Baugh (Florida) and receiver Malachi Toney (Miami), saw their Heisman momentum wane after less impactful recent performances. However, new faces are emerging on the fringe, such as Missouri's Jamal Roberts, who had a monster rushing day, and Nebraska's Anthony Colandrea, who impressed with both his arm and legs.\u003c/p\u003e\n\u003cp\u003eThe overall social sentiment surrounding Keelon Russell and CJ Carr's Heisman candidacies is largely positive, with ongoing discussions and healthy debate among college football enthusiasts and experts about who will ultimately hoist the iconic trophy.\u003c/p\u003e\n","title":"Heisman Hopefuls Emerge: Keelon Russell \u0026 CJ Carr Lead the Charge","authors":[{"username":"@elenvox","name":"Elen Vox"}],"date":"2026-10-05T08:37:54Z","summary":"Alabama's Keelon Russell and Notre Dame's CJ Carr have burst onto the Heisman Trophy Watch list, showcasing impressive Week 5 performances that have college football buzzing. Discover who's rising, who's falling, and the early contenders for college football's most prestigious individual award.","tags":["Heisman Trophy","College Football","Keelon Russell","CJ Carr","Alabama Crimson Tide","Notre Dame Fighting Irish","NCAAF","Sports News"],"sources":[{"url":"https://sports.yahoo.com/articles/keelon-russell-cj-carr-crack-011733323.html","title":"Keelon Russell, CJ Carr crack Sporting News Heisman Watch top contenders list"},{"url":"https://sports.yahoo.com/college-football/article/college-football-week-5-players-to-watch-many-of-the-heisman-favorites-will-take-the-field-in-the-first-weekend-of-october-134208125.html","title":"College football Week 5 players to watch: Many of the Heisman favorites will take the field in the first weekend of October"},{"url":"https://sports.yahoo.com/articles/heisman-trophy-rankings-5-early-140510063.html","title":"Heisman Trophy Rankings: 5 Early Frontrunners After Week 2 of College Football"},{"url":"https://www.msn.com/en-us/news/other/keelon-russell-is-boosting-no-7-alabamas-prospects-with-poised-and-prolific-play/ar-AA2dvff1?ocid=BingNewsVerp","title":"Keelon Russell is boosting No. 7 Alabama's prospects with poised and prolific play"},{"url":"https://www.msn.com/en-us/news/other/heisman-momentum-meter-texas-arch-manning-no-longer-in-contention-for-now/ar-AA2d7PLi?ocid=BingNewsVerp","title":"Heisman momentum meter: Texas' Arch Manning no longer in contention — for now"},{"url":"https://www.msn.com/en-us/news/other/2026-heisman-trophy-odds-tracker-week-1-new-signal-caller-takes-over-no-1-spot/ar-AA2bP3t4?ocid=BingNewsVerp","title":"2026 Heisman Trophy odds tracker, Week 1: New signal-caller takes over No. 1 spot"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"heisman-hopefuls-emerge-keelon-russell-cj-carr-lea"},"buildId":"BFMJo_6-kRoES5
