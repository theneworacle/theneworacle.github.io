<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-e000f3c4926d5b9b.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-9d8f6c641f7ffc28.js" defer=""></script><script src="/_next/static/oGUVjMsMuh29qyjo-RH6A/_buildManifest.js" defer=""></script><script src="/_next/static/oGUVjMsMuh29qyjo-RH6A/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"philippines-cracks-down-on-online-platforms-discor","contentHtml":"\u003cp\u003eIn a significant move impacting online communication and gaming communities, the Philippine government has taken action against popular platforms Discord and Reddit. Citing grave concerns over the proliferation of violent content and alleged links to the recruitment of youth for violent acts, the Cybercrime Investigation and Coordinating Center (CICC) directed both platforms to establish local offices in the Philippines.\u003c/p\u003e\n\u003cp\u003eThe initial announcement created uncertainty for millions of Filipino users, particularly the vibrant gaming community heavily reliant on Discord for communication and coordination. The CICC's 24-hour ultimatum put the platforms on notice, demanding compliance or face a ban.\u003c/p\u003e\n\u003cp\u003eThe outcome, however, has been bifurcated. Discord has reportedly been banned and rendered inaccessible by some major internet service providers, including Globe and DITO. This has left many users unable to access the platform, effectively cutting them off from their online communities. In contrast, Reddit was granted an extension and ultimately allowed to continue its operations after engaging with the CICC.\u003c/p\u003e\n\u003cp\u003eThe government's actions have not been without controversy. Critics have drawn comparisons to internet censorship practices seen in countries like China, raising questions about freedom of expression and the extent of government oversight on digital platforms. Social sentiment surrounding the issue appears to be divided, described as \"mostly positive, some debate,\" indicating a mixed public reaction to the crackdown.\u003c/p\u003e\n\u003cp\u003eThis development highlights the ongoing global challenge of balancing online safety and combating illegal activities with safeguarding internet freedom and ensuring access to essential communication tools. As the Philippines navigates this complex digital landscape, the implications for its online community and future internet policy remain a key point of discussion.\u003c/p\u003e\n","title":"Philippines Cracks Down on Online Platforms: Discord Banned, Reddit Continues Amidst Controversy","authors":[{"username":"@miguelreyes","name":"Miguel Reyes"}],"date":"2026-09-24T11:29:53Z","summary":"The Philippine government, through its Cybercrime Investigation and Coordinating Center (CICC), issued an ultimatum to Discord and Reddit over concerns about violent content and youth recruitment. While Discord has been banned on some major networks, Reddit was ultimately allowed to continue, sparking a broader debate on internet freedom and digital regulation in the country.","tags":["Philippines","Discord","Reddit","Internet Regulation","Cybercrime","CICC","Online Safety","Freedom of Speech","Gaming Community"],"sources":[{"url":"https://www.rappler.com/technology/discord-inaccessible-globe-dito-september-24-2026/","title":"Discord inaccessible on Globe, DITO as CICC 24-hour warning lapses"},{"url":"https://www.msn.com/en-ph/news/other/cybersecurity-agency-directs-discord-reddit-to-set-up-philippine-offices/ar-AA2cICPc?ocid=BingNewsVerp","title":"Cybersecurity agency directs Discord, Reddit to set up Philippine offices"},{"url":"https://www.msn.com/en-ph/news/news/discord-banned-in-ph-reddit-allowed-to-continue/ar-AA2cSvgB?ocid=BingNewsVerp","title":"Discord banned in PH, Reddit allowed to continue"},{"url":"https://www.msn.com/en-ph/news/other/threat-to-ban-reddit-discord-akin-to-china-repressi/ar-AA2cQ50B?ocid=BingNewsVerp","title":"Threat to ban Reddit, Discord akin to China repression"},{"url":"https://www.msn.com/en-ph/news/other/anticybercrime-body-sets-deadline-for-reddit-discord/ar-AA2cMnAG?ocid=BingNewsVerp","title":"Anticybercrime body sets deadline for Reddit, Discord"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"philippines-cracks-down-on-online-platforms-discor"},"buildId":"oGUVjMsMuh29qyjo-RH6A","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
