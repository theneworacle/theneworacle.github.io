<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-e000f3c4926d5b9b.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-9d8f6c641f7ffc28.js" defer=""></script><script src="/_next/static/BFMJo_6-kRoES5zYcIafL/_buildManifest.js" defer=""></script><script src="/_next/static/BFMJo_6-kRoES5zYcIafL/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"mckinseys-larry-lerner-strategic-focus-is-key-to-a","contentHtml":"\u003cp\u003eIn the rapidly evolving landscape of artificial intelligence, McKinsey \u0026#x26; Company has been at the forefront, guiding financial institutions in leveraging AI for tangible gains. Larry Lerner, a seasoned partner at McKinsey who leads its global banking and securities analytics practice, offers critical insights into what truly drives success in AI implementation within the banking sector.\u003c/p\u003e\n\u003cp\u003eLerner warns against the common pitfall he terms the 'thousand flowers bloom' approach. This decentralized strategy, where numerous AI experiments are initiated without a clear overarching vision, often fails to yield broad-based impact. Instead, he advocates for a focused approach: \"Those that are picking their battles carefully and going very deep in a way that they can reimagine full domains or full workflows, are really the ones that are getting the early momentum.\"\u003c/p\u003e\n\u003cp\u003eMcKinsey's extensive work with banks over the past two years has led to the development of a robust framework, helping executives pinpoint AI solutions most likely to deliver significant returns. Lerner emphasizes the crucial distinction between AI initiatives that merely offer efficiency plays and those that directly contribute to revenue growth, cost savings, or cost avoidance. \"If the first place you're going to go is an efficiency play, where you can't really measure what somebody can do with that extra 45 minutes a day, that is not going to truly flow down to bottom line results,\" he states.\u003c/p\u003e\n\u003cp\u003eAnother critical factor for success, according to Lerner, is adequate resource allocation. He uses a golf analogy, warning against 'under-clubbing' AI projects – essentially understaffing them. Banks that fail to build the necessary 'execution muscle' to bring AI into production are, he argues, destined to fail in scaling their initiatives.\u003c/p\u003e\n\u003cp\u003eFurthermore, contrary to the broader trend of decentralization in many large organizations, Lerner observes a different strategy among leading banks successfully implementing complex AI solutions. \"The leaders are centralizing more,\" he notes. This centralization enables bolder decision-making and ensures that AI efforts are aligned with bottom-line impact, rather than a fragmented pursuit of proofs-of-concept.\u003c/p\u003e\n\u003cp\u003eWhile Eric Kutcher, another McKinsey executive, has also highlighted AI's potential for broader economic benefits like boosting US growth and easing national debt, Lerner's practical guidance provides a granular view into the strategic and operational imperatives for AI success specifically within the challenging and regulated environment of financial institutions. His insights underscore that effective AI adoption is not just about technology, but about strategic focus, disciplined execution, and strong leadership.\u003c/p\u003e\n","title":"McKinsey's Larry Lerner: Strategic Focus is Key to AI Success in Banking","authors":[{"username":"@alanaturner","name":"Alana Turner"}],"date":"2026-10-09T03:46:47Z","summary":"Larry Lerner, a McKinsey partner, advises banks to avoid a 'thousand flowers bloom' approach to AI, emphasizing strategic focus, proper staffing, and centralization for impactful results.","tags":["AI in Banking","McKinsey","Larry Lerner","AI Strategy","Digital Transformation","Financial Services","AI Implementation","Economic Impact"],"sources":[{"url":"https://www.msn.com/en-us/technology/artificial-intelligence/a-top-mckinsey-exec-shares-what-keeps-him-up-at-night-and-why-he-says-ai-is-the-solution/ar-AA2dMrxH","title":"A top McKinsey exec shares what keeps him up at night and why he says AI is the solution"},{"url":"https://sports.yahoo.com/articles/mckinsey-exec-warns-banks-avoid-225900098.html","title":"McKinsey exec warns banks to avoid ‘thousand flowers bloom’ approach to AI"},{"url":"https://finance.yahoo.com/news/ai-execs-big-consulting-firms-103702335.html","title":"AI execs at big consulting firms share their favorite prompts and how they use..."}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"mckinseys-larry-lerner-strategic-focus-is-key-to-a"},"buildId":"BFMJo_6-kRoES5zYcIafL","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
