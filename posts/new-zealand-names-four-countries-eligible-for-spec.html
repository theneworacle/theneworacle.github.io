s will involve a ballot system, and a fee will be associated with the application, though the exact cost has not been widely disseminated.\u003c/p\u003e\n\u003cp\u003eThis initiative has been met with generally positive sentiment across social media platforms, with many welcoming the opportunity for greater regional mobility and support for Pacific communities. However, some debate also exists, likely concerning the scope and specifics of the visa, or broader immigration policies.\u003c/p\u003e\n\u003cp\u003eThis special visa underscores New Zealand's commitment to its Pacific Access Category, offering a structured and equitable pathway for its island neighbours to build new lives and contribute to New Zealand's diverse society.\u003c/p\u003e\n","title":"New Zealand Names Four Countries Eligible for Special Indefinite Residence Visa","authors":[{"username":"@sarahjones","name":"Sarah Jones"}],"date":"2026-08-19T04:35:46Z","summary":"New Zealand opens its 2026 Pacific Access Category (PAC) visa ballot, offering indefinite residence to citizens from Fiji, Kiribati, Tonga, and Tuvalu, aiming to strengthen regional ties and provide unique opportunities.","tags":["New Zealand","Visa","Immigration","Pacific Access Category","Fiji","Kiribati","Tonga","Tuvalu","Permanent Residence","PAC Visa"],"sources":[{"url":"https://www.msn.com/en-xl/news/other/new-zealand-names-4-countries-eligible-for-special-visa-with-indefinite-residence/ar-AA2a6w1H?ocid=BingNewsVerp","title":"New Zealand names 4 countries eligible for special visa with indefinite residence"},{"url":"https://www.msn.com/en-xl/africa/nigeria/new-zealand-special-visa-4-requirements-for-indefinite-stay-published/ar-AA2aay98?ocid=BingNewsVerp","title":"New Zealand special visa: 4 requirements for indefinite stay published"},{"url":"https://www.legit.ng/people/1725119-new-zealand-mentions-cost-special-visa-foreigners-indefinite-residence/","title":"New Zealand Shares Cost of Special Visa That Allows Foreigners Enjoy, Wor
