<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-e000f3c4926d5b9b.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-9d8f6c641f7ffc28.js" defer=""></script><script src="/_next/static/Wd6CsdUuuhWJ6tXLC8895/_buildManifest.js" defer=""></script><script src="/_next/static/Wd6CsdUuuhWJ6tXLC8895/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"philippines-bolsters-maritime-claims-un-receives-b","contentHtml":"\u003cp\u003eIn a significant diplomatic move, the Philippines has officially deposited its nautical chart of Bajo de Masinloc, also known as Scarborough Shoal, with the United Nations. This submission, made to the UN Secretariat on July 29, 2026, aims to formally notify the international community of the shoal's normal baselines and the geographic extent of the Philippines' applicable authority and jurisdiction, in accordance with the United Nations Convention on the Law of the Sea (UNCLOS) and domestic law.\u003c/p\u003e\n\u003cp\u003eBajo de Masinloc, a high-tide elevation, has been a flashpoint in the South China Sea dispute, with China maintaining control over the area since a tense standoff in 2012. This control has persisted despite the landmark 2016 Arbitral Award, which invalidated China's expansive claims in the South China Sea and affirmed the shoal as a traditional fishing ground for Filipino, Chinese, and Vietnamese fisherfolk.\u003c/p\u003e\n\u003cp\u003eThe Department of Foreign Affairs (DFA) emphasized that depositing the chart ensures the Philippines' official maritime information becomes part of the public international record, enhancing transparency and legal certainty. This action is a direct assertion of sovereignty and maritime rights against Beijing's continued presence and actions in the area.\u003c/p\u003e\n\u003cp\u003eChina's Ministry of Foreign Affairs swiftly rejected the Philippines' latest submission to the UN on July 31, reiterating its stance on the disputed territory. The region continues to experience heightened tensions, with reports of Chinese vessels, including the China Coast Guard and Maritime Militia, frequently harassing Philippine ships with dangerous maneuvers and water cannons.\u003c/p\u003e\n\u003cp\u003eFilipino fishermen have consistently faced obstructions to their access to Bajo de Masinloc, a traditional livelihood source. The Philippines has repeatedly called for China to remove floating platforms and structures from the area, though reports indicate a cycle of removal and re-establishment. Manila has vowed to maintain its maritime patrols and air surveillance, even as it monitors for new Chinese constructions and navigates China's proposed 'nature reserve plan' for the shoal.\u003c/p\u003e\n\u003cp\u003eBeyond the immediate territorial dispute, the DFA highlighted the submission's relevance in the face of climate change and sea-level rise. By preserving official nautical charts and baseline information with the UN, the Philippines contributes to a permanent and internationally recognized legal record of maritime entitlements, crucial as coastlines and marine environments evolve. Social media sentiment surrounding the Philippines' UN submission is largely positive, albeit with some ongoing debate, reflecting the complexity and sensitivity of the issue.\u003c/p\u003e\n\u003cp\u003eThis strategic move by the Philippines underscores its commitment to upholding international law and defending its sovereign rights in the West Philippine Sea, a stance that continues to draw international attention and support.\u003c/p\u003e\n","title":"Philippines Bolsters Maritime Claims: UN Receives Bajo de Masinloc Chart Amidst South China Sea Tensions","authors":[{"username":"@miguelreyes","name":"Miguel Reyes"}],"date":"2026-08-01T08:14:37Z","summary":"The Philippines has formally submitted its nautical chart of Bajo de Masinloc (Scarborough Shoal) to the United Nations, a strategic move to solidify its maritime entitlements and challenge China's decade-long control over the disputed feature in the West Philippine Sea.","tags":["Philippines","South China Sea","Bajo de Masinloc","Scarborough Shoal","UNCLOS","Maritime Dispute","China","Diplomacy","International Law"]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"philippines-bolsters-maritime-claims-un-receives-b"},"buildId":"Wd6CsdUuuhWJ6tXLC8895","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
