ery successful' BRICS Summit"},{"url":"https://www.msn.com/en-xl/news/other/philippines-invites-modi-as-india-ties-deepen-at-brics-summit/ar-AA2ccqKY","title":"Philippines invites Modi as India ties deepen at BRICS summit"},{"url":"https://www.malaysiasun.com/news/279306540/philippines-foreign-secy-hails-very-successful-brics-summit-under-india-chairship-highlights-south-south-cooperation","title":"Philippines Foreign Secy hails \"very successful\" BRICS summit under India's chairship, highlights South-South cooperation"},{"url":"https://www.bloomberg.com/news/articles/2026-09-09/philippines-marcos-to-join-brics-summit-in-india-push-closer-asean-ties","title":"Philippines' Marcos to Join BRICS Summit in India, Push Closer Asean Ties"},{"url":"https://thediplomat.com/2026/09/india-hosted-brics-summit-steers-clear-of-contentious-moves/","title":"India-hosted BRICS Summit Steers Clear of Contentious Moves"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"philippines-lauds-indias-successful-brics-summit-d"},"buildId":"oGUVjMsMuh29qyjo-RH6A","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
