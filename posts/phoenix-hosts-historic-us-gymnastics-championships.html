<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-e000f3c4926d5b9b.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-9d8f6c641f7ffc28.js" defer=""></script><script src="/_next/static/g3SR_BwsrdcBYjv-LrGUH/_buildManifest.js" defer=""></script><script src="/_next/static/g3SR_BwsrdcBYjv-LrGUH/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"phoenix-hosts-historic-us-gymnastics-championships","contentHtml":"\u003cp\u003ePhoenix recently played host to a landmark event in American gymnastics, as the Xfinity U.S. Gymnastics Championships made its debut in the vibrant city. This prestigious competition served as the culmination of a year-long journey for many elite athletes, laying crucial groundwork for the upcoming 2028 Los Angeles Olympics and the World Championships in Rotterdam, Netherlands.\u003c/p\u003e\n\u003cp\u003eThe energy in Phoenix was palpable, especially for two-time Olympic gold medalist Jade Carey, who relished competing in her hometown. Carey's presence highlighted the remarkable growth and increasing visibility of women's sports, a sentiment echoed by many throughout the event.\u003c/p\u003e\n\u003cp\u003eThe championships were a showcase of both established talent and emerging prowess. On the women's side, Hezly Rivera demonstrated incredible resilience and skill, successfully defending her U.S. all-around title in a captivating performance. For the men, Frederick Richard solidified his position as a leader in the sport, securing his first U.S. men's gymnastics all-around title with a statement-making display.\u003c/p\u003e\n\u003cp\u003eA significant narrative of the championships was the inspiring return of several gymnasts to the national stage. Athletes like Shane Wiskus and Stephen Nedoroscik on the men's side, and the aforementioned Hezly Rivera and Jade Carey on the women's, exemplified the immense dedication, sacrifice, and sheer grit required to compete at the sport's highest level after battling their way back to peak form.\u003c/p\u003e\n\u003cp\u003ePhoenix was chosen to host the championships from over 75 bids, a testament to the collaborative efforts of USA Gymnastics, Visit Phoenix, the City of Phoenix, and local sports organizations like the Suns and Mercury. Held at the Mortgage Matchup Center, the event offered more than just high-stakes competition; it provided a unique opportunity for younger athletes and aspiring gymnasts to witness their heroes perform live, fostering grassroots inspiration and growth within the sport. The widespread broadcast coverage also ensured that fans across the nation could follow every thrilling moment.\u003c/p\u003e\n\u003cp\u003eAs the gymnasts now look towards the World Championships and the ultimate goal of the 2028 Los Angeles Olympics, the Phoenix championships will undoubtedly be remembered as a pivotal moment – a starting point for many, and a testament to the enduring spirit and evolving landscape of American gymnastics.\u003c/p\u003e\n","title":"Phoenix Hosts Historic US Gymnastics Championships, Crowns New Champions and Inspires Future Stars","authors":[{"username":"@elenvox","name":"Elen Vox"}],"date":"2026-08-10T04:02:46Z","summary":"The Xfinity U.S. Gymnastics Championships recently concluded in Phoenix, marking a historic first for the city. The event saw Olympic medalists and rising stars compete for national titles, with Hezly Rivera defending her all-around crown and Frederick Richard making a statement in the men's division, all while setting the stage for the 2028 Los Angeles Olympics.","tags":["Gymnastics","US Championships","Phoenix","Jade Carey","Hezly Rivera","Frederick Richard","Olympics","USA Gymnastics","Sports"],"sources":[{"url":"https://sports.yahoo.com/articles/top-us-gymnasts-wrap-historic-012849510.html","title":"Top US gymnasts wrap up historic first championships in Phoenix"},{"url":"https://www.msn.com/en-us/sports/gymnastics/where-to-watch-us-gymnastics-championships-tv-schedule-times-channels-live-streams-for-men-women/ar-AA29voDV?ocid=BingNewsVerp","title":"Where to watch US Gymnastics Championships: TV schedule, times, channels, live streams for men, women"},{"url":"https://www.forbes.com/sites/carolineprice/2026/08/05/how-to-watch-the-2026-us-gymnastics-championships/","title":"How To Watch The 2026 U.S. Gymnastics Championships"},{"url":"https://www.msn.com/en-us/sports/other/how-to-watch-us-gymnastics-championships-2026-for-free-this-week/ar-AA29xuag?ocid=BingNewsVerp","title":"How to watch US Gymnastics Championships 2026 for free this week"},{"url":"https://www.forbes.com/sites/carolineprice/2026/08/09/hezly-rivera-comes-from-behind-to-win-second-us-gymnastics-title/","title":"Hezly Rivera Comes From Behind To Win Second U.S. Gymnastics Title"},{"url":"https://apnews.com/article/gymnastics-2028-olympics-frederick-richard-a630cd0f68b1712bfd89fd7f2869daec","title":"Frederick Richard makes a statement in more ways than one en route to first US gymnastics title"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"phoenix-hosts-historic-us-gymnastics-championships"},"buildId":"g3SR_BwsrdcBYjv-LrGUH","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
