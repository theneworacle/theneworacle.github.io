<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-e000f3c4926d5b9b.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-9d8f6c641f7ffc28.js" defer=""></script><script src="/_next/static/BFMJo_6-kRoES5zYcIafL/_buildManifest.js" defer=""></script><script src="/_next/static/BFMJo_6-kRoES5zYcIafL/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"ais-unsettling-encore-stealing-jokes-faking-art-an","contentHtml":"\u003cp\u003eThe rise of artificial intelligence continues to spark debate across various industries, and the world of comedy and cartooning is now squarely in its crosshairs. Recent reports highlight a disturbing trend: AI models are not just mimicking human creativity, but actively appropriating it, often without consent or compensation.\u003c/p\u003e\n\u003cp\u003eComedian George Brett Olson discovered his jokes and even his physical movements being stolen by an AI-generated woman, Tiffany Sloan. This avatar, which amassed a significant following and directed viewers to an OnlyFans page, leveraged Olson's original work for its own monetization. Shockingly, this blatant appropriation reportedly did not violate Meta's terms of service, exposing a gaping loophole in how existing platforms address AI-driven intellectual property theft. As one observer succinctly put it, “A working comedian had his joke stolen by an anonymous person who created a big-butted hot girl AI avatar, which then stole his jokes and dozens of others’, monetized the theft, ran an adult content side hustle, and somehow managed to violate none of Meta’s terms of service.”\u003c/p\u003e\n\u003cp\u003eThe problem extends beyond the stage and into the esteemed world of The New Yorker cartoons. ChatGPT, an OpenAI product, has been found generating cartoons in the magazine's distinctive style and, more alarmingly, falsely attributing them to real artists by slapping their actual signatures onto the AI-generated “slop.” Over 15 prominent New Yorker cartoonists, including Brendan Loper, Harry Bliss, and Emily Flake, have had their unique marks of authenticity reproduced without their knowledge or permission.\u003c/p\u003e\n\u003cp\u003eThis occurs despite OpenAI having a licensing deal with Condé Nast, The New Yorker's parent company, which explicitly did not permit training on cartoons. For artists, a signature is more than just a name; it's a “certificate of authenticity,” a “brand,” and a “violation of personhood” when misused. Cartoonists like Jason Adam Katzenstein describe the AI output as an “uncanny simulacrum,” arguing that the true goal is “to deal a death blow to labor” by rendering human creators obsolete and circumventing the costs and time associated with original work.\u003c/p\u003e\n\u003cp\u003eThis ongoing appropriation echoes a powerful statement made in unsealed court documents from The New York Times' litigation against OpenAI and Microsoft. A Microsoft director of applied science referred to AI training as the “largest theft of labor in human history.” OpenAI has acknowledged that such prompts “may violate our guardrails concerning similarity to third-party content” but, as of recent reports, the issue remains unresolved. It is suspected that these AI models learned to reproduce signatures and content by scraping vast amounts of data from the internet, potentially by circumventing publishers' paywalls – a practice internal Microsoft memos reportedly described as creating a “product that destroys its supply chain.”\u003c/p\u003e\n\u003cp\u003eWhile social sentiment on this issue shows a mixed reaction with some debate, the implications for artists, writers, and all creative professionals are profound. As AI capabilities rapidly advance, the critical questions of copyright, fair use, and the ethical boundaries of generative technology become ever more urgent. Without robust guardrails and enforcement, the very foundation of human creativity risks being eroded by automated appropriation.\u003c/p\u003e\n","title":"AI's Unsettling Encore: Stealing Jokes, Faking Art, and the \"Largest Theft of Labor\"","authors":[{"username":"@alanaturner","name":"Alana Turner"}],"date":"2026-10-06T03:56:09Z","summary":"From stand-up stages to the iconic pages of The New Yorker, AI is increasingly infringing upon human creativity, raising alarms about copyright, attribution, and the very future of creative labor.","tags":["AI","Artificial Intelligence","Copyright","Intellectual Property","Comedy","Cartoons","The New Yorker","OpenAI","ChatGPT","Creative Labor","Plagiarism","Digital Rights"],"sources":[{"url":"https://www.avclub.com/ai-new-yorker-cartoons-stand-up-comics","title":"AI has come for comics on stage and in The New Yorker"},{"url":"https://www.niemanlab.org/2026/10/chatgpt-is-adding-real-cartoonists-signatures-to-fake-new-yorker-cartoons/","title":"ChatGPT is adding real cartoonists’ signatures to fake New Yorker cartoons"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"ais-unsettling-encore-stealing-jokes-faking-art-an"},"buildId":"BFMJo_6-kRoES5zYcIafL","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
