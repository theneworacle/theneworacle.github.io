<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-e000f3c4926d5b9b.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-9d8f6c641f7ffc28.js" defer=""></script><script src="/_next/static/-0qRYmp9UHOftVF9J9OoZ/_buildManifest.js" defer=""></script><script src="/_next/static/-0qRYmp9UHOftVF9J9OoZ/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"philippines-delivers-crushing-p176-billion-fine-to","contentHtml":"\u003cp\u003eThe Philippine Competition Commission (PCC) has made headlines with a landmark decision, levying an unprecedented P1.76 billion (approximately $28 million) fine against an onion cartel. This decisive action comes after a thorough investigation revealed a sophisticated scheme by six firms and their officers to manipulate the market through illegal allocation of onion imports, resulting in exorbitant prices that severely impacted Filipino consumers.\u003c/p\u003e\n\u003cp\u003eIn 2022, the Philippines experienced an acute \"onion crisis,\" where the price of onions skyrocketed to levels exceeding the daily minimum wage. This dramatic surge in prices was a direct consequence of the cartel's anti-competitive practices, which involved controlling nearly 50% of all approved import clearances for red and yellow onions in 2020 and 2021. By systematically applying for import clearances across various companies, monitoring permit allocations, and coordinating shipments to specific cold storage facilities for nationwide distribution, the cartel effectively stifled competition and dictated market prices.\u003c/p\u003e\n\u003cp\u003eThe PCC's investigation, which included court-ordered raids, uncovered compelling evidence of this market allocation. The Commission's decision to impose the maximum fines underscores its unwavering commitment to combating cartels and protecting consumers from exploitative practices across all economic sectors.\u003c/p\u003e\n\u003cp\u003eThe public reaction to the record fine has been largely positive, with many welcoming the government's strong stance against price manipulation. While some debate exists on social media, the general sentiment reflects a demand for fair market practices and accountability from those who exploit essential commodities. This monumental fine serves as a stark warning that such illicit activities will not be tolerated and reaffirms the PCC's role in ensuring a competitive and fair market for all. Individuals involved in cartel activities may also face criminal charges, including prison terms and additional fines, further solidifying the consequences of anti-competitive behavior.\u003c/p\u003e\n","title":"Philippines Delivers Crushing P1.76 Billion Fine to Onion Cartel for Price Manipulation","authors":[{"username":"@miguelreyes","name":"Miguel Reyes"}],"date":"2026-10-16T11:07:51Z","summary":"The Philippine Competition Commission has imposed a historic P1.76 billion (approximately $28 million) fine on an onion cartel, holding six firms and their officers accountable for an illegal market allocation scheme that sent onion prices soaring in 2022.","tags":["Philippines","Onion Cartel","Price Manipulation","Philippine Competition Commission","PCC","Fine","Economic Crime","Consumer Protection","Market Allocation","Agriculture"],"sources":[{"url":"https://www.msn.com/en-us/news/world/onion-cartel-in-philippines-fined-28m-for-price-shock/ar-AA2ekXjv?ocid=BingNewsVerp","title":"Onion cartel in Philippines fined $28m for price shock"},{"url":"https://www.bloomberg.com/news/articles/2026-10-15/philippines-hits-onion-cartel-with-record-fine-for-price-surge","title":"Philippines Hits Onion Cartel With Record Fine for Price Surge"},{"url":"https://www.msn.com/en-ph/money/investment/6-firms-in-onion-cartel-face-p1-76-b-fines-raps/ar-AA2ek7jN?ocid=BingNewsVerp","title":"6 firms in 'onion cartel' face P1.76-B fines, raps"},{"url":"https://www.msn.com/en-ph/news/other/pcc-slaps-p176-billion-fine-on-2022-onion-cartel/ar-AA2ejNBL?ocid=BingNewsVerp","title":"PCC slaps P1.76 billion fine on 2022 onion cartel"},{"url":"https://portcalls.com/pcc-fines-onion-cartel-a-record-p1-76b/","title":"PCC fines onion cartel a record P1.76B"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"philippines-delivers-crushing-p176-billion-fine-to"},"buildId":"-0qRYmp9UHOftVF9J9OoZ","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
