<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-e000f3c4926d5b9b.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-9d8f6c641f7ffc28.js" defer=""></script><script src="/_next/static/Wd6CsdUuuhWJ6tXLC8895/_buildManifest.js" defer=""></script><script src="/_next/static/Wd6CsdUuuhWJ6tXLC8895/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"netball-nz-explores-private-investment-for-future-","contentHtml":"\u003cp\u003eNetball New Zealand (Netball NZ) is currently engaged in crucial discussions with at least one private investor concerning the establishment of a new franchise league in 2028. This potential move signifies a major restructuring for the elite domestic netball competition in New Zealand.\u003c/p\u003e\n\u003cp\u003eThe proposed model would see a private entity, reportedly a 'high net-worth family' with existing ties to the sporting world, assume responsibility for operating the ANZ Premiership. Former Silver Ferns stars Adine Wilson and Anna Stanley are credited with facilitating the introduction of this investor. Under this innovative arrangement, the new league would function independently of Netball NZ, with the private owner overseeing all commercial and operational aspects.\u003c/p\u003e\n\u003cp\u003eThese pivotal talks are taking place against a backdrop of considerable financial strain for Netball NZ. The organization anticipates losses of up to $6 million for the current financial year, with approximately $3.7 million directly attributable to the cost of running the ANZ Premiership. Furthermore, the absence of a broadcast deal for 2027 has intensified concerns regarding the long-term viability of the existing league structure.\u003c/p\u003e\n\u003cp\u003eThe New Zealand Netball Players’ Association has voiced its openness to considering substantial changes, including private investment. Their primary condition is that such measures must enhance netball's commercial value, provide meaningful professional opportunities for players, and ensure a clear pathway for aspiring athletes.\u003c/p\u003e\n\u003cp\u003eHowever, the projected 2028 launch of a privately backed league introduces a period of uncertainty for players concerning their professional contracts for the 2027 season. In response to this ambiguity, Netball NZ has already lifted restrictions that previously required Silver Ferns and other top players to seek dispensation before signing with overseas clubs. While there is speculation that 2027 might serve as a 'bridging year' – potentially involving a temporary suspension of the ANZ Premiership or a return to an amateur competition – Netball NZ officials remain adamant that a domestic competition will proceed next season.\u003c/p\u003e\n\u003cp\u003eOverall, the simulated social sentiment regarding this news is largely positive, albeit with some ongoing debate. This initiative is widely viewed as a hopeful development for the domestic game, with privatization increasingly seen as a necessary step to overcome financial challenges and establish a sustainable professional netball league in New Zealand.\u003c/p\u003e\n","title":"Netball NZ Explores Private Investment for Future League","authors":[{"username":"@sarahjones","name":"Sarah Jones"}],"date":"2026-08-05T07:45:39Z","summary":"Facing significant financial hurdles, Netball New Zealand is in advanced discussions with a private investor to launch a new franchise league by 2028, aiming to secure a sustainable and professional future for the sport's elite domestic competition.","tags":["Netball","New Zealand","Sports","Investment","ANZ Premiership","Privatization","Sports Business"],"sources":[{"url":"https://www.msn.com/en-nz/money/general/netball-nz-in-talks-with-private-investor-over-new-league-for-2028/ar-AA29pOGq?ocid=BingNewsVerp","title":"Netball NZ in talks with private investor over new league for 2028"},{"url":"https://www.nzherald.co.nz/sport/netball/netball-nz-in-talks-over-private-anz-premiership-league-from-2028/IK6RHX4W3NEHHJBA35OGFWYTDI/","title":"Netball NZ in talks over private ANZ Premiership league from 2028"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"netball-nz-explores-private-investment-for-future-"},"buildId":"Wd6CsdUuuhWJ6tXLC8895","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
